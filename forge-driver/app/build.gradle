plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.popclub.forgedriver'
    compileSdk 34

    defaultConfig {
        applicationId "com.popclub.forgedriver"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Keep the test APK alive — we use it as a long-running server
    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }
}

dependencies {
    // UiAutomator — direct device interaction, no Appium
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.2'
    androidTestImplementation 'junit:junit:4.13.2'

    // Lightweight HTTP server (no Android-incompatible deps)
    androidTestImplementation 'org.nanohttpd:nanohttpd:2.3.1'

    // JSON
    androidTestImplementation 'com.google.code.gson:gson:2.10.1'

    androidTestUtil 'androidx.test:orchestrator:1.4.2'
}
