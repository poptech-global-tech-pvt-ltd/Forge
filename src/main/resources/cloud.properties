# ─────────────────────────────────────────────────────────────────────────────
# Run mode
# ─────────────────────────────────────────────────────────────────────────────
#   cloud.enabled=true   → reserve a device from the pop-device-farm (STF)
#   cloud.enabled=false  → use a device connected directly via USB/ADB
# ─────────────────────────────────────────────────────────────────────────────
cloud.enabled=true

# ─────────────────────────────────────────────────────────────────────────────
# Device farm settings (only used when cloud.enabled=true)
# ─────────────────────────────────────────────────────────────────────────────

# Base URL of the pop-device-farm instance (no trailing slash)
stf.base.url=https://10.25.11.207

# Bearer token for testdevices@popclub.co
# To regenerate: POST https://<stf-url>/auth/api/v1/mock  {"name":"Forge","email":"testdevices@popclub.co"}
stf.api.token=eyJhbGciOiJIUzI1NiIsImV4cCI6MTc3ODk0MzUzMTgyN30.eyJlbWFpbCI6InRlc3RkZXZpY2VzQHBvcGNsdWIuY28iLCJuYW1lIjoiRm9yZ2UifQ.KcFG7TUkYoxTAftNW2ek2zq9OczhMmMU4YsTwb3X4hU

# How long (ms) to hold the device reservation (default: 10 min)
stf.device.timeout.ms=600000

# (Optional) Filter by Android version e.g. 14  — leave blank for any device
stf.platform.version=

# (Optional) Pin to a specific device serial — leave blank to auto-pick
stf.device.serial=

# ─────────────────────────────────────────────────────────────────────────────
# Appium / Android SDK paths  (used in both modes)
# ─────────────────────────────────────────────────────────────────────────────
appium.node.path=/opt/homebrew/bin/node
appium.js.path=/opt/homebrew/lib/node_modules/appium/build/lib/main.js

# Android SDK root — must contain build-tools/ with aapt2
android.home=/opt/homebrew/share/android-commandlinetools
