# ─────────────────────────────────────────────────────────────────────────────
# Run mode
# ─────────────────────────────────────────────────────────────────────────────
#   cloud.enabled=false  → use a device connected directly via USB/ADB  (DEFAULT)
#   cloud.enabled=true   → reserve a device from the pop-device-farm (STF)
#
# To enable cloud mode on your machine, create:
#   src/main/resources/config/local.cloud.properties
# and add:
#   cloud.enabled=true
#   stf.base.url=https://<device-farm-ip>
# That file is gitignored and will override this default.
# ─────────────────────────────────────────────────────────────────────────────
cloud.enabled=false

# ─────────────────────────────────────────────────────────────────────────────
# Device farm settings (only used when cloud.enabled=true)
# ─────────────────────────────────────────────────────────────────────────────

# Base URL of the pop-device-farm instance (no trailing slash)
# Leave blank to auto-detect from the en0 network interface (same IP start.sh uses)
stf.base.url=

# Auth credentials — Forge auto-generates a fresh token on every run (no manual updates needed)
stf.auth.email=testdevices@popclub.co
stf.auth.name=Forge

# How long (ms) to hold the device reservation (default: 10 min)
stf.device.timeout.ms=600000

# (Optional) Filter by Android version e.g. 14  — leave blank for any device
stf.platform.version=

# (Optional) Pin to a specific device serial — leave blank to auto-pick
stf.device.serial=

# ─────────────────────────────────────────────────────────────────────────────
# Appium / Android SDK paths  (used in both modes)
# ─────────────────────────────────────────────────────────────────────────────
# Appium paths — leave blank to auto-detect from PATH (recommended)
# Override here only if auto-detection fails on your machine.
# Example (Homebrew):  appium.node.path=/opt/homebrew/bin/node
# Example (nvm):       appium.node.path=/Users/you/.nvm/versions/node/v20.x.x/bin/node
appium.node.path=
appium.js.path=

# Android SDK root — leave blank to use ANDROID_HOME / ANDROID_SDK_ROOT env var
android.home=
