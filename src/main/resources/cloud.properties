# ─────────────────────────────────────────────────────────────────────────────
# Cloud / STF (DeviceFarmer) Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Set cloud.enabled=true to run tests on your in-house STF device farm.
# Set cloud.enabled=false (or omit) to run locally via ADB as before.
# ─────────────────────────────────────────────────────────────────────────────

# ── Feature flag ──────────────────────────────────────────────────────────────
cloud.enabled=true

# ── STF settings ──────────────────────────────────────────────────────────────
# Base URL of your STF / DeviceFarmer instance (no trailing slash)
stf.base.url=https://10.25.11.207



# Bearer token — generate from STF UI: Settings → Keys → Access Tokens
# ⚠️  Replace this with your actual token before running
stf.api.token=eyJhbGciOiJIUzI1NiIsImV4cCI6MTc3ODk0MzUzMTgyN30.eyJlbWFpbCI6InRlc3RkZXZpY2VzQHBvcGNsdWIuY28iLCJuYW1lIjoiRm9yZ2UifQ.KcFG7TUkYoxTAftNW2ek2zq9OczhMmMU4YsTwb3X4hU

# How long (milliseconds) to hold a device reservation  (default: 10 minutes)
stf.device.timeout.ms=600000

# (Optional) Only pick devices running this Android version e.g. 12, 13
# Leave blank to use any available Android device
stf.platform.version=

# (Optional) Target a specific device by its serial/UDID shown on https://10.25.11.235/#/devices
# Leave blank to auto-pick the first available device
stf.device.serial=

# ── Local Appium server (used to drive the ADB-connected STF device) ──────────
# Update these paths to match your machine's node / appium installation
appium.node.path=/opt/homebrew/bin/node
appium.js.path=/opt/homebrew/lib/node_modules/appium/build/lib/main.js

# Android SDK root — must contain build-tools/ with aapt2 so Appium can analyse APKs
# Install build-tools if missing:  sdkmanager --sdk_root=<path> "build-tools;34.0.0"
android.home=/opt/homebrew/share/android-commandlinetools
