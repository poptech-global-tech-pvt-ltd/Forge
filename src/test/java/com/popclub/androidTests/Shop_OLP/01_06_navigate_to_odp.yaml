testName: OLP — Tap order to ODP, rate widget, delivered status
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11334

features:
  - common
  - login
  - home
  - shop
  - profile

tags:
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: call
    flow: navigate_to_orders

  # ── Filter to Delivered orders ──
  - action: tap
    element: olp_filter_dropdown

  - action: tap
    element: olp_filter_delivered_radio

  - action: tapByText
    value: "Apply"

  - action: waitFor
    element: order_item_v2_status_text
    timeout: 10

  # PO-11338: Delivered status label visible
  - action: verifyElement
    element: order_item_v2_status_text
    testCaseId: PO-11338

  # PO-11334: Tap order card navigates to ODP
  - action: tap
    element: order_item_v2_status_text

  - action: waitFor
    element: invoice  # healed from: order_details_v2_status_text
    timeout: 5

  - action: verifyElement
    element: order_details_v2_status_text
    testCaseId: PO-11334

  # PO-11332: Rate your order widget on delivered order (above product image)
  - action: verifyElement
    text: "Rate this product"
    testCaseId: PO-11332

  # Go back to OLP
  - action: pressKey
    value: BACK

  - action: waitFor
    element: order_item_v2_status_text
    timeout: 5

  - action: logVar
    variable: placeholder
    value: "OLP delivered filter + ODP navigation + rate widget verified"
