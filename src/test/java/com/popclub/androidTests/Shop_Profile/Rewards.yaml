  - action: pressKey
    value: back

  # ── PO-13847: Cashback Widget navigation ───────────────────────────────
  - action: tap
    element: profile_quick_action_cashback_button

  - action: verifyElement
    element: pop_chip_row
    testCaseId: PO-13847

  - action: pressKey
    value: back