testName: Demo — Login
platform: android
noReset: true

testCaseIds:
  - PO-15994

features:
  - login
  - shop
  - home

tags:
  - smoke
  - login

retry: 1

steps:
  - action: launchApp

  - action: enterText
    element: login_input_phone
    dataRef: users.test_user_default.login

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    dataRef: users.test_user_default.otp

  - action: waitFor
    element: home_tab

  - action: verifyElement
    element: home_tab
