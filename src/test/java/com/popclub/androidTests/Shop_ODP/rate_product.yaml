testName: ODP — Rate product, track order, delivered badge
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-9074
  - PO-9078
  - PO-9073
  - PO-9048

features:
  - common
  - login
  - home
  - shop
  - profile

tags:
  - odp
  - shop
  - regression

retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234563737"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: call
    flow: navigate_to_olp

  # Search for delivered order by brand name
  - action: tap
    element: olp_search_field_input

  - action: enterText
    element: olp_search_field_input
    value: "superyou"

  - action: pressKey
    value: search

  # Verify ODP loaded
  - action: waitFor
    element: order_details_v2_pay_in3_product_info_row
    timeout: 5000

  # PO-9048: Progress bar / status visible
  - action: verifyElement
    element: Truck
    testCaseId: PO-9048

