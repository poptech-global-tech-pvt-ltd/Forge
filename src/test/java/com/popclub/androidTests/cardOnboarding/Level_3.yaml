  - action: verifyElement
    element: cc_additional_relation_with_officer_yes_chip

  - action: verifyElement
    element: cc_additional_relation_with_officer_no_chip
    testCaseId: PO-7707

  - action: verifyElement
    element: cc_additional_submit_button
    testCaseId: PO-7723

  - action: tap
    element: cc_additional_politically_exposed_yes_chip

  - action: verifyElement
    element: cc_additional_politically_exposed_yes_chip
