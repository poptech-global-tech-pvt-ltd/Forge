testName: Card Onboarding Level 3 - Additional Details (PEP Check)
platform: android
noReset: true
loginRequired: true

testCaseIds:
  - PO-7707

features:
  - common
  - credit_card

tags:
  - smoke
  - card
  - onboarding

retry: 1

