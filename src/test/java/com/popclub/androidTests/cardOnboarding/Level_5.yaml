  #  NEGATIVE TEST CASES
  # ════════════════════════════════════════════════════════════════

  - action: enterText
    element: cc_professional_income_input
    value: "50000"

  - action: verifyElement
    element: cc_professional_submit_button
    testCaseId: PO-7814

  - action: enterText
    element: cc_professional_income_input
    value: ""

  # ════════════════════════════════════════════════════════════════
  #  SAVE & EXIT TESTS
  # ════════════════════════════════════════════════════════════════

  - action: verifyElement
    element: cc_eligibility_save_exit_button
    testCaseId: PO-7805

  - action: tap
    element: cc_eligibility_save_exit_button

  - action: verifyElement
    element: cc_eligibility_confirm_exit_button
    testCaseId: PO-7806

  - action: verifyElement
    element: cc_eligibility_cancel_exit_button
    testCaseId: PO-7807

  - action: tap
    element: cc_eligibility_cancel_exit_button

  - action: verifyElement
    element: cc_professional_company_name_input
    testCaseId: PO-7810

  - action: tap
    element: cc_eligibility_save_exit_button

  - action: tap
