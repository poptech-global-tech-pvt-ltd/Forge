    value: "Near Metro Station"
    testCaseId: PO-7750

  - action: enterText
    element: cc_residential_pincode_input
    value: "400028"
    testCaseId: PO-7757

  - action: verifyElement
    element: cc_residential_submit_button
    testCaseId: PO-7759

  - action: tap
    element: cc_residential_submit_button

  - action: verifyElement
