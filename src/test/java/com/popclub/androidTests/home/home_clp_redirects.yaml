testName: Home CLP Redirects All Items
platform: android
noReset: true

testCaseIds:
  - PO-HOME-CLP-REDIRECTS

features:
  - home
  - login

tags:
  - clp
  - home
  - redirects

retry: 0

steps:
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  - action: enterText
    element: login_input_phone
    dataRef: users.test_user_default.login

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    dataRef: users.test_user_default.otp

  - action: captureToken
    dataRef: users.test_user_default

  - action: waitFor
    element: home_tab

  - action: verifyCLP
    value: HOME

  - action: verifyCLPRedirects
    value: HOME
    text: "all"
