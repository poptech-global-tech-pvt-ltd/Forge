testName: Home CLP Verification
platform: android
noReset: false

testCaseIds:
  - PO-HOME-CLP

features:
  - home
  - login

tags:
  - smoke
  - clp
  - home

retry: 1

steps:
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  - action: enterText
    element: login_input_phone
    value: 1234561122

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    value: 560102

  # Login via API to get JWT — CI-safe, no logcat needed
  - action: captureToken
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # Fetch pophomenew API response (with user token) and assert every section title is rendered
  - action: verifyCLP
    value: HOME
