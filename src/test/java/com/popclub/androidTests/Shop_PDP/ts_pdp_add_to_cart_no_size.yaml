testName: PDP — Add to Cart without size shows size prompt
platform: android
noReset: false
loginRequired: true
retry: 0

testCaseIds:
  - PO-11070

features:
  - common
  - login
  - home
  - shop

tags:
  - regression
  - shop

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561234"
    text: "560102"

  - action: tap
    element: common_shop_tab


  - action: call
    flow: search_and_open_pdp
    params:
      search_query: "snitch"
      search_pincode: "560102"

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: verifyElement
    element: size_selection_item_0

  - action: verifyElement
    element: size_selection_add_to_cart_button
