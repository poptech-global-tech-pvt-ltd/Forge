testName: PDP — Size selector
platform: android
noReset: false
loginRequired: true
retry: 1

testCaseIds:
  - PO-11041

features:
  - common
  - login
  - home
  - shop

tags:
  - sanity
  - regression
  - shop

steps:
  - action: call
    flow: login_and_go_to_shop

  - action: call
    flow: search_and_open_pdp
    params:
      search_query: "snitch"
      search_pincode: "560102"

  - action: swipe
    direction: up

  - action: ifPresent
    element: product_details_size_option_0
    steps:
      - action: verifyElement
        element: product_details_size_option_0

      - action: verifyElement
        element: product_details_size_chart_button
        testCaseId: PO-11042

      - action: tap
        element: product_details_size_chart_button

      - action: verifyElement
        element: product_details_size_chart_full_page_dialog_row
        testCaseId: PO-11044

      - action: pressKey
        value: back

      - action: tap
        element: product_details_size_option_0

      - action: verifyElement
        element: product_details_bottom_sticky_bar_button

      - action: tapIfPresent
        element: product_details_size_option_1

      - action: swipe
        direction: down

      - action: tap
        element: product_details_bottom_sticky_bar_button

      - action: tapIfPresent
        element: size_selection_item_0

      - action: tapIfPresent
        element: size_selection_add_to_cart_button

      # ── PO-11057: CTA changes to "Go to cart" ───────────────────────────
      - action: verifyElement
        element: product_details_go_to_cart_button

      # ── PO-11059: Tap 'Go to cart' → navigates to Cart ────────────────
      - action: tap
        element: product_details_bottom_sticky_bar_button

      - action: verifyElement
        element: cart_item_row_0
        testCaseId: PO-11059

    else:
      - action: verifyElement
        element: product_details_size_option_0
        shouldExist: false

      - action: verifyElement
        element: product_details_size_chart_button
        shouldExist: false
        testCaseId: PO-11041

      - action: swipe
        direction: down

      - action: tap
        element: product_details_bottom_sticky_bar_button

      - action: tapIfPresent
        element: size_selection_item_0

      - action: tapIfPresent
        element: size_selection_add_to_cart_button

      # ── PO-11057: CTA changes to "Go to cart" ───────────────────────────
      - action: verifyElement
        element: product_details_go_to_cart_button

      # ── PO-11059: Tap 'Go to cart' → navigates to Cart ────────────────
      - action: tap
        element: product_details_bottom_sticky_bar_button

      - action: verifyElement
        element: cart_item_row_0
        testCaseId: PO-11059