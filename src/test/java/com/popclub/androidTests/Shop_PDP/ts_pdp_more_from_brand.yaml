testName: PDP — More from this brand
platform: android
noReset: true
loginRequired: true
retry: 1

testCaseIds:
  PO-11055

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - pdp
  - more-from-brand

steps:
  - action: call
    flow: login_and_go_to_shop

  - action: call
    flow: search_and_open_pdp

  # ── Scroll down to 'More from this brand' section ──────────────────────
  - action: swipe
    value: up

  - action: swipe
    value: up

  # ── PO-11054: Verify section and horizontal scroll ─────────────────────
  - action: verifyElement
    element: product_details_similar_products_section_row

  - action: verifyElement
    element: product_details_similar_product_card_row
    testCaseId: PO-11054

  - action: swipe
    value: left

  - action: verifyElement
    element: product_details_similar_product_card_row
    testCaseId: PO-11054

  # ── PO-11055: Tap a product card → opens new PDP ──────────────────────
  - action: tap
    element: product_details_similar_product_card_row

  - action: waitFor
    element: product_details_title
    testCaseId: PO-11055