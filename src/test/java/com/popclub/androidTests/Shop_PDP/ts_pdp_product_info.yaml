testName: PDP — Core product info, PLP-to-PDP price match
platform: android
noReset: true
loginRequired: false
retry: 0

testCaseIds:
  - PO-11039

features:
  - common
  - login
  - home
  - shop

tags:
  - sanity
  - regression
  - shop

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561234"
    text: "560102"

  - action: tap
    element: common_shop_tab

  - action: tap
    element: shop_search_button

  - action: enterText
    element: search_products_search_input
    value: "the souled store"

  - action: pressKey
    value: search

  - action: captureText
    element: product_list_item_title_1
    variable: plp_title

  - action: captureText
    element: product_list_item_price_1
    variable: plp_selling_price

  - action: captureText
    element: product_list_item_price_1  # healed from: product_list_item_strikethrough_price_1
    variable: plp_mrp_price

  - action: captureText
    element: product_list_item_brand_1
    variable: plp_brand

  - action: logVar
    variable: plp_title
    value: |
      ── PLP prices captured ──
      plp_title          - ${plp_title}
      plp_brand          - ${plp_brand}
      plp_selling_price  - ${plp_selling_price}
      plp_mrp_price      - ${plp_mrp_price}

  - action: tap
    element: product_list_item_1

  # ── PO-11039: Verify core product info elements ─────────────────────────
  - action: verifyElement
    element: product_details_title

  - action: verifyElement
    element: product_details_price

  - action: verifyElement
    element: product_details_strikethrough_price

  # ── Capture PDP prices ─────────────────────────────────────────────────
  - action: captureText
    element: product_details_price
    variable: pdp_selling_price

  - action: captureText
    element: product_details_strikethrough_price
    variable: pdp_mrp_price

  - action: logVar
    variable: pdp_selling_price
    value: |
      ── PDP prices captured ──
      pdp_selling_price  - ${pdp_selling_price}
      pdp_mrp_price      - ${pdp_mrp_price}

  - action: verifyElement
    element: product_details_strikethrough_price

  # ── Assert: PLP prices must match PDP prices ───────────────────────────
  - action: assertText
    element: product_details_price
    value: "${plp_selling_price}"

  - action: assertText
    element: product_details_strikethrough_price
    value: "${plp_mrp_price}"

  # ── Popcoin visibility ─────────────────────────────────────────────────
  - action: ifVarEquals
    variable: api_product_list_item_special_pricing
    value: "true"
    steps:
      - action: verifyElement
        element: product_details_popcoin
        shouldExist: true

  # ── Verify share button ────────────────────────────────────────────────
  - action: verifyElement
    element: product_details_share_button

  - action: tap
    element: product_details_share_button

  - action: pressKey
    value: back
