testName: PDP — Header icons (Back, Search, Cart, POPCoins)
platform: android
noReset: true
loginRequired: true
retry: 0

testCaseIds:
  - PO-11032

features:
  - common
  - login
  - home
  - shop

tags:
  - sanity
  - regression
  - shop

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561234"
    text: "560102"

  - action: tap
    element: common_shop_tab

  - action: tap
    element: shop_search_button

  - action: enterText
    element: search_products_search_input
    value: "the souled store"

  - action: pressKey
    value: search

  - action: tap
    element: product_list_item_0

  # ── PO-11032: Verify all header icons exist ───────────────────────────
  - action: tap
    element: pdp_search_icon

  - action: tap
    element: toolbar_search_button  # healed locator → search_back_button

  - action: tap
    element: product_details_go_to_cart_button

  - action: tap
    element: cart_back_button

  - action: tap
    element: toolbar_popcoin_button

  - action: tap
    element: popcoins_navigation

  # ── PO-11033: Back arrow returns to PLP ─────────────────────────────────
  - action: tap
    element: product_details_back_button

  - action: verifyElement
    element: product_list_filter_button

  - action: tap
    element: product_list_item_0

  - action: verifyElement
    element: product_details_title
    testCaseId: PO-11033

  # ── PO-11034: Cart badge shows 0 for new user ──────────────────────────
  - action: assertText
    element: toolbar_popcoin_button
    value: "0"
    testCaseId: PO-11034