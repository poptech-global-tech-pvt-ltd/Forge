testName: PDP — Add to Cart without size shows size prompt
platform: android
noReset: false
loginRequired: true
retry: 1

testCaseIds:
  - PO-11070

features:
  - common
  - login
  - home
  - shop

tags:
  - regression
  - shop

steps:
  - action: call
    flow: login_and_go_to_shop

  - action: call
    flow: search_and_open_pdp
    params:
      search_query: "snitch"
      search_pincode: "560102"

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: verifyElement
    element: size_selection_item_0

  - action: verifyElement
    element: size_selection_add_to_cart_button

  - action: captureText
    element: select_size_popup
    variable: select_size_text

  - action: assertText
    element: select_size_popup
    value: "${select_size_text}"