# Covers: browse + category/month filter intersection + combined-filter chip count + view details
testName: "E2E - Transaction History: Browse, Filter by Category and Month, and View Transaction Details"
platform: android
noReset: true
loginRequired: false

testCaseIds: [PO-15556, PO-13267, PO-13271]

features: [common, billpay]

tags: [smoke, rcbp, billpay, history, e2e]

retry: 0

steps:
  - action: launchApp
  
  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"
    
  - action: tap
    element: bills_tab  
 
  # CONFIRM: entry point to RCBP transaction history
  - action: scrollTo
    element: edge_image_banner_image_8  # healed locator → clp_section_row_1
   
  - action: tap
    element: edge_image_banner_image_8
 
  # Category + Month filter together (2 filters active → intersection + combined chip count)
  - action: tap
    element: month
    
  - action: tap
    element: bill_pay_txn_history_filter_option_0 # CONFIRM: category value
    
  - action: tap
    element: bill_pay_txn_history_filter_apply_button
    
  - action: tap
    element: bill_pay_txn_history_filter_chip_item_1
    
  - action: tap
    element: bill_pay_txn_history_filter_option_0 
    
  - action: tap
    element: bill_pay_txn_history_filter_apply_button

  # PO-13267 — intersected results present
  - action: verifyElement
    element: bill_pay_txn_history_clear_all_filter_button
    testCaseId: P0-13267
    
  # PO-13271 — 2+ filters active → combined count indicator on entry chip
  #- action: captureText
    #element: bill_pay_txn_history_filter_chip
    #value: filter_chip_label 
    #testCaseId: P0-13271 # manually confirm label shows a "2" / combined count

  # PO-15556 — view transaction details
  - action: tap
    element: bill_pay_txn_history_item_0
    
  - action: waitFor
    element: bill_pay_txn_details_screen
    
  - action: verifyElement
    element: bill_pay_txn_details_screen
    testCaseId: P0-15556