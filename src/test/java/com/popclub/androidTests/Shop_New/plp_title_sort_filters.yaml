testName: PO-10986 — Verify PLP displays page title and Sort + Filters pills below header
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-10986

features:
  - common
  - login
  - home
  - shop

tags:
  - regression
  - shop

retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: tap
    element: common_shop_tab

   # ── PLP: navigate, capture API + UI prices ────────────────────────────────
  - action: call
    flow: plp_search_and_capture
    params:
      search_query: "shoes"
      search_pincode: "560102"
      
  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  # Verify page title and Sort/Filter pills
  - action: assertText
    element: plp_sort_text
    value: "Sort"

  - action: verifyElement
    element: product_list_filter_button
    testCaseId: PO-10986

  - action: verifyElement
    element: product_list_filter_button