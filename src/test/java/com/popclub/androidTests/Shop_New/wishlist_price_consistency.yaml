testName: Wishlist — Price consistency across PLP, PDP and Cart
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-15336

features:
  - common
  - login
  - home
  - shop

tags:
  - wishlist
  - price
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # Search for "superyou" — no size selection needed
  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "superyou"

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  # Capture price on PLP
  - action: captureText
    element: product_list_item_price_0
    value: "plp_price"

  # Open PDP and capture price
  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  - action: captureText
    element: product_details_price
    value: "pdp_price"

  # Add to cart
  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tapIfPresent
    element: size_selection_item_0

  - action: tapIfPresent
    element: size_selection_add_to_cart_button

  # Go to cart
  - action: tap
    element: product_details_go_to_cart_button

  - action: waitFor
    element: cart_item_row_0

  # Capture price in cart
  - action: captureText
    element: cart_item_price_0
    value: "cart_price"

  # Assert PLP price matches PDP price
  - action: assertStoredText
    value: "plp_price"