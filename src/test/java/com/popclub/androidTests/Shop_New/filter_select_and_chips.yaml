testName: Filters — Select filter, select all, verify chips, remove chip
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11017
  - PO-11018
  - PO-11019
  - PO-11020

features:
  - common
  - login
  - home
  - shop

tags:
  - filter
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: tap
    element: search_trending_item_0

  - action: waitFor
    element: product_list_item_0

  # Open filter sheet
  - action: tap
    element: product_list_filter_button

  - action: waitFor
    element: product_filter_category_item_0

  # PO-11017: Select a filter option (first sub-item)
  - action: tap
    element: product_filter_category_item_0

  - action: waitFor
    element: product_filter_sub_item_0

  - action: tap
    element: product_filter_sub_item_0
    testCaseId: PO-11017

  # PO-11018: Tap select all
  - action: tap
    element: product_filter_select_all_checkbox
    testCaseId: PO-11018

  # PO-11019: Apply filters and verify chips appear
  - action: tap
    element: product_filter_apply_button
    testCaseId: PO-11019

  - action: waitFor
    element: product_list_item_0

  # PO-11020: Reopen filter and reset to remove filters
  - action: tap
    element: product_list_filter_button

  - action: waitFor
    element: product_filter_reset_button

  - action: tap
    element: product_filter_reset_button
    testCaseId: PO-11020

  - action: waitFor
    element: product_list_item_0

  - action: scanTags