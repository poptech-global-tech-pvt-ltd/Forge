testName: PLP — Cart icon badge updates when product added
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11030

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: tap
    element: common_shop_tab

   # ── PLP: navigate, capture API + UI prices ────────────────────────────────
  - action: call
    flow: plp_search_and_capture
    params:
      search_query: "superyou"
      search_pincode: "560102"

  # Open PDP and add to cart
  - action: tap
    element: product_list_item_0

  - action: tap
    element: product_details_bottom_sticky_bar_button

  # Go back to PLP
  - action: pressKey
    value: product_details_back_button

  - action: waitFor
    element: product_list_item_0

  # PO-11030: Verify cart icon is visible (badge should show count)
  - action: verifyElement
    element: toolbar_cart_button
    testCaseId: PO-11030