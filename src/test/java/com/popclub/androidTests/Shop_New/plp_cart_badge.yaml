testName: PLP — Cart icon badge updates when product added
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11030

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # Search for superyou (no size selection)
  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "superyou"

  - action: pressKey
    value: search

  # Open PDP and add to cart
  - action: tap
    element: product_list_item_0


  - action: tap
    element: product_details_bottom_sticky_bar_button

  # Go back to PLP
  - action: pressKey
    value: product_details_back_button

  - action: waitFor
    element: product_list_item_0

  # PO-11030: Verify cart icon is visible (badge should show count)
  - action: verifyElement
    element: toolbar_cart_button
    testCaseId: PO-11030