testName: PO-11001 — Verify tapping a Recent search chip performs the search
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11001

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab
 

  # Do a search first to populate Recent searches
  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "shoes"

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  # Go back to Search screen
  - action: tap
    element: Navigation
    
  - action: waitFor
    element: search_back_button  
    
  
  - action: tap
    element: search_back_button

  - action: waitFor
    element: shop_search_button

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  # Tap the first recent search chip
  - action: tap
    element: search_recent_item_0

  # Verify PLP loads with search results
  - action: waitFor
    element: product_list_item_0