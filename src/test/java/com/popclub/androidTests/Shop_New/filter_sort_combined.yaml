testName: Filters — Sort and Filter combined results
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11028

features:
  - common
  - login
  - home
  - shop

tags:
  - filter
  - sort
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: tap
    element: search_trending_item_0

  - action: waitFor
    element: product_list_item_0

  # Apply Sort first — Price Low to High
  - action: tap
    element: product_list_sort_button

  - action: tapByText
    value: "Price Low → High"

  - action: waitFor
    element: product_list_item_0

  # Now apply Filter
  - action: tap
    element: product_list_filter_button

  - action: waitFor
    element: product_filter_category_item_0

  - action: tap
    element: product_filter_category_item_0

  - action: waitFor
    element: product_filter_sub_item_0

  - action: tap
    element: product_filter_sub_item_0

  - action: tap
    element: product_filter_apply_button
    testCaseId: PO-11028

  # Verify PLP loads with combined sort + filter
  - action: waitFor
    element: product_list_item_0

  - action: scanTags