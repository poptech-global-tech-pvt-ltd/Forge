testName: shop sort flow low to high
platform: android
noReset: true
loginRequired: false


testCaseIds:
  - PO-11009
  - PO-11010
  - PO-11011
  - PO-11012
  - PO-11013 

features:
  - common
  - login
  - home
  - shop

retry: 1

tags:
  - smoke

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab
   
  - action: tap
    element: common_shop_tab
    
  # Navigate to PLP through Search 
  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: tap
    element: search_trending_item_0
    
  - action: waitFor
    element: product_list_item_0
    
  # Capture 1st product price before sort  
  - action: captureText
    element:  product_list_item_0
    value: "product_list_item_price_0"
    
    
  # Verify Sort and Filters are present  
  - action: verifyElement
    element: product_list_sort_button
    
  - action: tap
    element: product_list_sort_button
    
  # Verify Sort options are visible
  - action: tapByText
    value: "Price Low → High"
    testCaseId: PO-11010
    
    
  # Wait for PLP to reload
  - action: waitFor
    element: product_list_item_0
    
  # Capture first product's price after sort
  - action: captureText
    element:  product_list_item_0
    value: "product_list_item_price_0"