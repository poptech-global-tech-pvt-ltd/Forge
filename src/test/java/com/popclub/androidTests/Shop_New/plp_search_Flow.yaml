testName: PO-10985 — Verify PLP header displays all icons (Back, Search, Wishlist, Cart, POPCoins)
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-10985
  - PO-11007
  - PO-11005
  - PO-11002
  
features:
  - common
  - login
  - home
  - shop

tags:
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: waitFor
    element: shop_search_button

  # Navigate to PLP via search
  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "shoes"
    
   # Tap the X (clear) button
  - action: tap
    element: Clear
    testCaseId: PO-11005

  # Navigate to 1st Trending item
  - action: tap
    element: search_trending_item_0
    testCaseId: PO-11002

  - action: waitFor
    element: product_list_item_0

  # Verify all PLP header icons
  - action: verifyElement
    element: Navigation

  - action: verifyElement
    element: toolbar_search_button

  - action: verifyElement
    element: toolbar_wishlist_button

  - action: verifyElement
    element: toolbar_cart_button

  - action: verifyElement
    element: toolbar_popcoin_button
    testCaseId: PO-10985
    

  # Back to PLP from search results
  - action: tap
    element: Navigation
    
  - action: waitFor
    element: search_products_search_input
    
  - action: tap
    element: search_back_button
    testCaseId: PO-11007