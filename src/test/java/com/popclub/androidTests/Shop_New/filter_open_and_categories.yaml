testName: Filters — Open filter sheet, verify categories, close without changes
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11014
  - PO-11015
  - PO-11027

features:
  - common
  - login
  - home
  - shop

tags:
  - filter
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: tap
    element: shop_search_icon

  - action: waitFor
    element: search_products_search_input

  - action: tap
    element: search_trending_item_0

  - action: waitFor
    element: product_list_item_0

  # Capture PLP price before filter
  - action: captureText
    element: product_list_item_price_0
    variable: plp_first_product_price

  # PO-11014 + PO-11015: Filter sheet opened with categories visible
  - action: tap
    element: product_list_filter_button

  - action: waitFor
    element: product_filter_category_item_0

  - action: verifyElement
    element: product_filter_category_item_0

  - action: verifyElement
    element: product_filter_category_item_1

  - action: verifyElement
    element: product_filter_reset_button
    testCaseId: PO-11014

  - action: verifyElement
    element: product_filter_apply_button
    testCaseId: PO-11015

  # PO-11027: Close filter sheet without applying
  - action: pressKey
    value: BACK

  - action: waitFor
    element: product_list_item_0

  - action: assertText
    element: product_list_item_price_0
    value: "${plp_first_product_price}"
    testCaseId: PO-11027