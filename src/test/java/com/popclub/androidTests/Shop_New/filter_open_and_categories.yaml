testName: Filters — Open filter sheet, verify categories, close without changes
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11014
  - PO-11015
  - PO-11027

features:
  - common
  - login
  - home
  - shop

tags:
  - filter
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: tap
    element: shop_search_icon  # healed from: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: tap
    element: search_trending_item_0

  - action: waitFor
    element: product_list_item_0

  # PO-11014: Tap Filters pill to open filter sheet
  - action: tap
    element: product_list_filter_button
    testCaseId: PO-11014

  # PO-11015: Verify filter categories are visible
  - action: verifyElement
    element: product_filter_category_item_0
    testCaseId: PO-11015

  - action: verifyElement
    element: product_filter_category_item_1

  # PO-11027: Close filter sheet without applying (tap X / back)
  - action: pressKey
    value: BACK
    testCaseId: PO-11027

  # Verify we're back on PLP unchanged
  - action: waitFor
    element: product_list_item_0

  - action: scanTags