testName: Wishlist — Empty state after removing last item
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11474

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # Add one product to wishlist
   # ── PLP: navigate, capture API + UI prices ────────────────────────────────
  - action: call
    flow: plp_search_and_capture
    params:
      search_query: "superyou"
      search_pincode: "560102"
      
  - action: tap
    element: product_list_item_0

  - action: tap
    element: product_details_wishlist_button

  - action: pressKey
    value: BACK

  # Go to wishlist
  - action: tap
    element: toolbar_wishlist_button

  # Remove the only item
  - action: tap
    element: wishlist_remove_button
    testCaseId: PO-11474

  # Verify empty state appears
  - action: tapByText
    value: "Explore more"