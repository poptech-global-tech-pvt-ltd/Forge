testName: Wishlist — Back arrow and Cart icon navigation
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11481

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: tap
    element: common_shop_tab
    
 # ── PLP: navigate, capture API + UI prices ────────────────────────────────
  - action: call
    flow: plp_search_and_capture
    params:
      search_query: "the souled store"
      search_pincode: "560102"

  # Go to wishlist
  - action: tap
    element: toolbar_wishlist_button

  - action: waitFor
    element: wishlist_item_card_compose_row

  # PO-11482: Tap cart icon — navigates to Cart
  - action: tap
    element: toolbar_cart_button
    testCaseId: PO-11482

  - action: waitFor
    element: cart_item_row_0

  - action: pressKey
    value: BACK

  - action: waitFor
    element: wishlist_item_card_compose_row

  # PO-11481: Tap back arrow — exits wishlist
  - action: tap
    element: wishlist_back_button
    testCaseId: PO-11481

  # Verify we're back on PLP
  - action: waitFor
    element: product_list_item_0