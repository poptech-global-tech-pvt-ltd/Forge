testName: Order Success Screen — Verify UI elements, timestamp, popcoin savings, Done CTA
platform: android
noReset: true
loginRequired: true

testCaseIds:
  - PO-9384
 

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # Search superyou (no size selection needed)
  # ── PLP: navigate, capture API + UI prices ────────────────────────────────
  - action: call
    flow: plp_search_and_capture
    params:
      search_query:   "the souled store"
      search_pincode: "560102"

  - action: tap
    element: product_list_item_0

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tap
    element: product_details_go_to_cart_button

  # Mini cart bottomsheet
  - action: tap
    element: cart_s2_s_payment_button_button_2

  - action: waitFor
    element: cart_item_row_0

  # Capture popcoin balance before order
  - action: captureText
    element: toolbar_popcoin_button
    variable: popcoin_before

  - action: logVar
    variable: popcoin_before
    value: "POPCoins before order: ${popcoin_before}"

  # Tap Pay
  - action: tap
    element: cart_link_and_pay_button

  - action: waitFor
    element: shop_payment_screen_row

  # Select COD
  - action: scrollUntilVisible
    element: shop_payment_shop_cod_section_button

  - action: tap
    element: shop_payment_shop_cod_section_button

  - action: tapByText
    value: "Cash on Delivery"

  # Confirm COD payment
  - action: scrollUntilVisible
    text: "Pay"
    direction: down

  - action: tapByText
    value: "Pay"

  # PO-11569: Verify OSS shows all required UI elements
  - action: waitFor
    element: order_success_title_text

  - action: verifyElement
    element: order_success_title_text

  - action: verifyElement
    element: order_success_item_0

  - action: verifyElement
    element: order_success_copy_order_id_button
    testCaseId: PO-11569

  # PO-9384: Verify timestamp and popcoin savings badge
  - action: verifyElement
    element: order_success_detailed_components_earned_points_banner_compose_view_row
    testCaseId: PO-9384

  # PO-11577: Verify POPCoins balance updated in header
  - action: captureText
    element: toolbar_popcoin_button
    variable: popcoin_after

  - action: logVar
    variable: popcoin_after
    value: "POPCoins after order: ${popcoin_after}"

  - action: verifyElement
    element: toolbar_popcoin_button
    testCaseId: PO-11577

  # PO-9385: Tap Done — navigates back to home
  - action: tapByText
    value: "Done"

  - action: waitFor
    element: home_tab

  - action: verifyElement
    element: home_tab
    testCaseId: PO-9385