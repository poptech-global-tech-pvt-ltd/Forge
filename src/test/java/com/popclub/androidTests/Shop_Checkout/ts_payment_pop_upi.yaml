testName: Payment — POP UPI expand, select account, add bank
platform: android
noReset: true
loginRequired: false
features:
  - common
  - login
  - home
  - shop
tags:
  - shop
  - payment
  
retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: call
    flow: add_to_cart_and_pay
    params:
      search_query: "the souled store"
      search_pincode: "560102"

  - action: call
    flow: navigate_to_payment_sheet

  # ── PO-15710: POP UPI section expands to show saved accounts ──
  - action: tap
    element: shop_payment_shop_pop_upi_section_button

  - action: verifyElement
    element: shop_payment_account_item_0
    shouldExist: true
    testCaseId: PO-15710

  # ── PO-15711: Select POP UPI account updates footer, closes sheet ──
  - action: tap
    element: shop_payment_account_item_0

  - action: verifyElement
    element: payment_method_title_text
    shouldExist: false
    testCaseId: PO-15711

  # ── PO-15712: Tap '+ Add bank account' opens add account flow ──
  # Reopen sheet
  - action: tap
    element: cart_payment_method_bottom_sheet_button

  - action: waitFor
    element: payment_method_title_text
    timeout: 3000

  - action: tap
    element: payment_method_other_options_button

  - action: scrollUntilVisible
    element: shop_payment_add_bank_account_button
    direction: down
    maxScrolls: 3

  - action: tap
    element: shop_payment_add_bank_account_button

  - action: verifyElement
    element: payment_method_add_account_button
    shouldExist: true
    testCaseId: PO-15712

  - action: pressKey
    value: BACK