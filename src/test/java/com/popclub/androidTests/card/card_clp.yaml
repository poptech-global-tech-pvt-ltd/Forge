testName: Card CLP Verification
platform: android
noReset: true

testCaseIds:
  - PO-CARD-CLP

features:
  - home
  - login
  - credit_card

tags:
  - smoke
  - clp
  - card

retry: 1

steps:
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  - action: enterText
    element: login_input_phone
    dataRef: test_user_default.login

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    dataRef: test_user_default.otp

  # Login via API to get JWT — CI-safe, no logcat needed
  - action: captureToken
    dataRef: test_user_default

  - action: waitFor
    element: home_tab

  - action: tap
    element: card_tab

  # Fetch credit-card-2 API response and assert every section title is rendered
  - action: verifyCLP
    value: CARD
