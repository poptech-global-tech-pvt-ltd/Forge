testName: SMV Fail - New User - WA Pass - CX Callback
platform: android
noReset: false
loginRequired: false

# Prereq: Phone number must be a NEW user account (no prior POP login, not a CC user).
# SMV must be forced to fail via backend test flag or unsupported-carrier SIM.
# WhatsApp must be installed on the device for WA verification to pass.
# Expected: WA verification triggers automatically → CX callback screen shown.

features:
  - login
  - common

tags:
  - login
  - smv

retry: 1

steps:
  - action: launchApp

  - action: scanTags

  - action: enterText
    element: login_input_phone
    value: "9481781677"

  - action: tap
    element: login_button

  - action: scanTags

  # SMV fails silently. WhatsApp verification triggers automatically.
  - action: waitFor
    locator: smv_wa_verification_screen   # TODO: add to elements/login.yaml — accessibilityId TBD

  - action: scanTags   # capture WA verification screen tags to find real accessibilityId for smv_wa_verification_screen

  # WA verification passes. CX callback screen should appear.
  - action: waitFor
    locator: smv_cx_callback_screen   # TODO: add to elements/login.yaml — accessibilityId TBD

  - action: scanTags   # capture CX callback screen tags to find real accessibilityId for smv_cx_callback_screen

  - action: verifyElement
    locator: smv_cx_callback_screen   # TODO: add to elements/login.yaml — accessibilityId TBD
