testName: SMV Fail - Existing User - WA Fail - Contextual Failure Screen
platform: android
noReset: false
loginRequired: false
testCaseIds:
  - PO-15536

features:
  - login
  - common

tags:
  - login
  - smv

retry: 1

steps:
  - action: launchApp

  - action: waitFor
    element: login_input_phone

  - action: enterText
    element: login_input_phone
    value: "9481781677"

  - action: tap
    element: login_continue_button

  - action: pressKey
    value: BACK

  - action: waitFor
    element: login_input_phone
    timeout: 10

  - action: tap
    element: login_continue_button

  - action: waitFor
    element: login_merged_login_and_otp_screen_button
    timeout: 60

  - action: tapByText
    value: "Try again"
    timeout: 60
