testName: Login - Edit Phone Number From OTP Screen
platform: android
noReset: false
loginRequired: true
testCaseIds:
  - PO-15633

features:
  - login

tags:
  - login
  - regression

retry: 1

steps:
  - action: launchApp

  - action: waitFor
    element: login_phone_input

  - action: enterText
    element: login_phone_input
    value: "9481781678"

  - action: tap
    element: login_continue_button

  - action: pressKey
    value: "BACK"

  - action: pressKey
    value: "BACK"

  - action: tapByText
    value: "Edit"
    timeout: 30

  - action: waitFor
    element: login_phone_input
