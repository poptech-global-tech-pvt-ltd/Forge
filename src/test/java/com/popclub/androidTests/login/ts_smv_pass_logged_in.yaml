testName: SMV Pass - Logged In
platform: android
noReset: false
loginRequired: true

# Prereq: SIM on a carrier that supports SMV (e.g. Jio/Airtel).
# SMV runs silently after phone number is entered — no user interaction needed.
# Expected: 3-sec loader appears, then user lands on home screen.

features:
  - login
  - common

tags:
  - smoke
  - login
  - smv

retry: 1

steps:
  - action: launchApp

  - action: enterText
    element: login_input_phone
    value: "9538351687"

  - action: tap
    element: login_button

  - action: waitFor
    element: skip_tour
    timeout: 120

  - action: tap
    element: skip_tour

  - action: verifyElement
    element: home_tab
