testName: SMV Fail - New User - WA Fail - Contextual Failure Screen
platform: android
noReset: false
loginRequired: false

# Prereq: Phone number must be a NEW user account (no prior POP login, not a CC user).
# SMV must be forced to fail via backend test flag or unsupported-carrier SIM.
# WhatsApp must NOT be installed on the device (or WA verification must fail).
# Expected: Both SMV and WA fail → contextual failure screen shown.

features:
  - login
  - common

tags:
  - login
  - smv

retry: 1

steps:
  - action: launchApp

  - action: scanTags

  - action: enterText
    element: login_input_phone
    value: "9481781677"

  - action: tap
    element: login_button

  - action: scanTags

  # SMV fails silently. WA verification attempt also fails (not installed / verification failed).
  - action: waitFor
    locator: smv_contextual_failure_screen   # TODO: add to elements/login.yaml — accessibilityId TBD

  - action: scanTags   # capture contextual failure screen tags to find real accessibilityId for smv_contextual_failure_screen

  - action: verifyElement
    locator: smv_contextual_failure_screen   # TODO: add to elements/login.yaml — accessibilityId TBD
