testName: Login Test
platform: android
noReset: true

testCaseIds:
  - PO-1589

features:
  - login
  - shop
  - home

tags:
  - smoke
  - login

retry: 1  

steps:
  - action: launchApp

  - action: enterText
    element: login_input_phone
    dataRef: users.test_user_default.login

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    dataRef: users.test_user_default.otp


#  - action: tap
#    element: skip_tour

  - action: waitFor
    element: home_tab

  - action: verifyElement
    element: home_tab

  - action: tap
    element: shop_tab
    
  - action: tap
    element: shop_search_icon

  - action: enterText
    element: search_input
    dataRef: products.default_search.search_term

  - action: tap
    element: search_input


