testName: Order Success Screen — Cart cleared and OLP redirect
platform: android
noReset: true
loginRequired: true

testCaseIds:
  - PO-11578
 

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # ── PLP: navigate, capture API + UI prices ────────────────────────────────
  - action: call
    flow: plp_search_and_capture
    params:
      search_query:   "the souled store"
      search_pincode: "560102"

  - action: pressKey
    value: search

  - action: tap
    element: product_list_item_0


  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tap
    element: product_details_go_to_cart_button

  - action: tap
    element: cart_s2_s_payment_button_button_2


  - action: tap
    element: cart_link_and_pay_button

  - action: waitFor
    element: shop_payment_screen_row

  - action: scrollUntilVisible
    element: shop_payment_shop_cod_section_button

  - action: tap
    element: shop_payment_shop_cod_section_button

  - action: tapByText
    value: "Cash on Delivery"

  - action: scrollUntilVisible
    text: "Pay"
    direction: down

  - action: tapByText
    value: "Pay"


  # PO-13023: Tap product image — redirects to OLP
  - action: tap
    element: order_success_item_0

  - action: waitFor
    element: order_list_item_status_0

  - action: verifyElement
    element: order_list_item_status_0
    testCaseId: PO-13023

  # Navigate back to home
  - action: pressKey
    value: BACK

  - action: pressKey
    value: BACK

  - action: waitFor
    element: home_tab

  # PO-11578: Verify cart is cleared — go to shop, open cart
  - action: tap
    element: common_shop_tab

  - action: tap
    element: toolbar_cart_button

  # Cart should be empty — verify empty state or no cart items
  - action: tapByText
    value: "Your cart is empty"
    testCaseId: PO-11578