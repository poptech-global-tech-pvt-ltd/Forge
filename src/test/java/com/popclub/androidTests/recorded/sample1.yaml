testName: sample1
platform: android
noReset: true
loginRequired: false
retry: 1


features:
  - common
  - login
  - home
  - shop

tags:
  - smoke

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab
    
  - action: tap
    element: common_shop_tab
      
  - action: verifyElement
    element: toolbar_cart_button
    
  - action: tap
    element: toolbar_cart_button
    
  - action: verifyElement
    element: Merchant background
    
  - action: tap
    element: Select

  # ── Wishlist verification ─────────────────────────────────────────────────
  - action: waitFor
    element: product_details_title

  - action: captureText
    element: product_details_title
    value: wishlisted_title

  - action: tap
    element: product_details_wishlist_button

  - action: pressKey
    value: BACK

  - action: tap
    element: wishlist_icon

  - action: waitFor
    element: wishlist_item_card_compose_row

  - action: assertStoredText
    value: wishlisted_title
