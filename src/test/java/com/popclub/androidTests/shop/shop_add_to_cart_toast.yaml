testName: Shop — Add to Cart Success Toast
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-15308
  - PO-11057

features:
  - common
  - shop
  - LOG

tags:
  - smoke
  - shop

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    dataRef: users.test_user_default

  - action: waitFor
    element: home_tab  # healed locator → common_home_tab

  - action: tap
    element: common_shop_tab

  - action: waitFor
    element: shop_search_button

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "t-shirt"

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: waitFor
    element: size_selection_item_0

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  - action: waitFor
    element: add_to_cart_snackbar
    testCaseId: PO-15310

  - action: waitFor
    element: product_details_go_to_cart_button

  - action: verifyElement
    element: product_details_go_to_cart_button