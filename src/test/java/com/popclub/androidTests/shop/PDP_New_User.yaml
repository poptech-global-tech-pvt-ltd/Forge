testName: Wishlist — PDP
platform: android
noReset: true
loginRequired: true
retry: 1

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - wishlist

steps:
  - action: launchApp
  - action: loginIfNeeded
    value: "1234561819"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # ── API: get product data ────────────────────────────────────────────────
  - action: call
    flow: search_get_product
    params:
      search_query:   "yogabar"
      search_pincode: "560102"

  # ── UI: search and navigate to PLP ───────────────────────────────────────
  - action: waitFor
    element: toolbar_search_button  # healed from: shop_search_button

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "yogabar"

  - action: pressKey
    value: search
    
  - action: waitFor
    element: product_list_filter_button
    
  - action: tap
    element: product_list_item_0

  # ── Open PDP  ─────────────────────────────────────────

  - action: waitFor
    element: product_details_title
    
  - action: tap
    element: pdp_search_icon
    
  - action: tap
    element: search_back_button
    
  - action: tap
    element: product_details_go_to_cart_button
    
  - action: tap
    element: cart_back_button
   
  - action: waitFor
    element: product_details_title
    
  - action: tap
    element: toolbar_popcoin_button
    
  - action: tap
    element: popcoins_navigation
    
  - action: tap
    element: product_details_product_info_section_row
  
  - action: tap
    element: product_list_item_${product_index}

  - action: waitFor
    element: product_details_title

  - action: captureText
    element: product_details_price
    variable: pdp_selling_price

  - action: captureText
    element: product_details_strikethrough_price
    variable: pdp_mrp_price

  - action: logVar
    variable: pdp_selling_price
    value: |
      ── PDP prices captured ──
      pdp_selling_price  - ${pdp_selling_price}
      pdp_mrp_price      - ${pdp_mrp_price}
      
 # ====================================================
 

  # ── 2. Change address → enter pincode → check delivery ──────────────────
  - action: swipe
    value: up

  - action: waitFor
    element: product_details_check_delivery_date_section_row

  - action: tap
    element: product_details_check_delivery_date_section_row
    
  - action: tap
    element: product_details_change_address_button
   
  - action: tap
    element: Expand
  
  - action: waitFor
    element: Collapse
    
  - action: tap
    element: Collapse
    
  - action: swipe
    value: down
    
  - action: tap
    element: View_more
    
  - action: waitFor
    element: product_list_item_0

  - action: verifyElement
    element: product_list_item_0

  - action: pressKey
    value: back
    
  - action: waitFor
    element: product_details_title

  - action: swipe
    value: down

 
 
 # =====================================================
      

 # ── Add to cart ──────────────────────────────────────────────────────────
  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tapIfPresent
    element: size_selection_item_0

  - action: tapIfPresent
    element: size_selection_add_to_cart_button

  # ── CTA changes to "Go to cart" → tap it ─────────────────────────────────
  - action: waitFor
    element: product_details_go_to_cart_button

  - action: tap
    element: product_details_go_to_cart_button

  # ── Cart: wait for cart to load ──────────────────────────────────────────
  - action: waitFor
    element: cart_item_row_0

  # ── Cart: capture prices ─────────────────────────────────────────────────
  - action: captureText
    element: cart_item_price_0
    variable: cart_selling_price

  - action: captureText
    element: cart_item_strikethrough_price_0
    variable: cart_mrp_price

  - action: logVar
    variable: cart_selling_price
    value: |
      ── Cart prices captured ──
      cart_selling_price  - ${cart_selling_price}
      cart_mrp_price      - ${cart_mrp_price}

  # ── Assert: PDP prices must match Cart prices ───────────────────────────
  - action: assertText
    element: cart_item_price_0
    value: "${pdp_selling_price}"

  - action: assertText
    element: cart_item_strikethrough_price_0
    value: "${pdp_mrp_price}"
 
    
    
  
  

