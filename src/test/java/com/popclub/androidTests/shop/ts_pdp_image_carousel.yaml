# PO-11032 — Verify PDP header shows Back arrow, Search, Cart, and POPCoins icons
testName: PDP — Header icons (Back, Search, Cart, POPCoins)
platform: android
noReset: true
loginRequired: true
retry: 1

testCaseIds:
  - PO-11032

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - pdp
  - header

steps:
  - action: call
    flow: navigate_to_pdp
    params:
      search_query:   "yogabar"
      search_pincode: "560102"
      login_phone:    "1234561819"
      login_pin:      "560102"

  # ── Verify all header icons exist ────────────────────────────────────────
  - action: verifyElement
    element: common_back_button
    testCaseId: PO-11032

  - action: verifyElement
    element: pdp_search_icon
    testCaseId: PO-11032

  - action: verifyElement
    element: product_details_go_to_cart_button
    testCaseId: PO-11032

  - action: verifyElement
    element: toolbar_popcoin_button
    testCaseId: PO-11032

  # ── Verify Search icon navigates and comes back ──────────────────────────
  - action: tap
    element: pdp_search_icon

  - action: tap
    element: search_back_button

  - action: waitFor
    element: product_details_title

  # ── Verify Cart icon navigates and comes back ───────────────────────────
  - action: tap
    element: product_details_go_to_cart_button

  - action: tap
    element: cart_back_button

  - action: waitFor
    element: product_details_title

  # ── Verify POPCoins icon navigates and comes back ───────────────────────
  - action: tap
    element: toolbar_popcoin_button

  - action: tap
    element: popcoins_navigation

  - action: waitFor
    element: product_details_title