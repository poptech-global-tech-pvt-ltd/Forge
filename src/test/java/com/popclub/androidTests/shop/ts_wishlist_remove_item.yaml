testName: Wishlist — Remove item from wishlist
platform: android
noReset: true
loginRequired: true

features:
  - common
  - home
  - shop

tags:
  - smoke
  - shop
  - wishlist

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # ── Navigate to Shop and search ──────────────────────────────────────────
  - action: tap
    element: common_shop_tab

  - action: waitFor
    element: shop_search_icon

  - action: tap
    element: shop_search_icon

  - action: enterText
    element: search_input
    value: "t-shirt"

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  # ── Add item to wishlist from PDP ────────────────────────────────────────
  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  - action: tap
    element: product_details_wishlist_button

  - action: pressKey
    value: back

  - action: waitFor
    element: product_list_item_0

  # ── Go to wishlist ───────────────────────────────────────────────────────
  - action: tap
    element: wishlist_icon

  - action: waitFor
    element: wishlist_item_card_compose_row

  - action: verifyElement
    element: wishlist_item_0

  # ── Remove item ──────────────────────────────────────────────────────────
  - action: tap
    element: wishlist_remove_button
