testName: Shop — Full Flow (Search → PDP → Add to Cart → Cart Verify)
platform: android
noReset: true
loginRequired: true

testCaseIds:
  - PO-SHOP-FULL-FLOW

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - shop
  - full_flow

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    dataRef: test_user_default

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: scanTags

  - action: waitFor
    element: shop_search_button

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: scanTags

  - action: enterText
    element: search_products_search_input
    value: "t-shirt"

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  - action: scanTags

  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  - action: scanTags

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: waitFor
    element: size_selection_item_0

  - action: scanTags

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  - action: waitFor
    element: product_details_go_to_cart_button

  - action: scanTags

  - action: tap
    element: product_details_go_to_cart_button

  - action: scanTags

  - action: waitFor
    element: cart_item_row_0

  - action: verifyElement
    element: cart_delivery_address_card

  - action: verifyElement
    element: cart_to_pay_row

  - action: verifyElement
    element: cart_s2_s_payment_button_button

  - action: scanTags
