testName: PDP — Core product info, PLP-to-PDP price match
platform: android
noReset: true
loginRequired: true
retry: 1

testCaseIds:
  - PO-11039

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - pdp
  - product-info

steps:
  - action: call
    flow: login_and_go_to_shop

  - action: call
    flow: search_and_open_pdp

  # ── Capture PLP prices before PDP opens (already on PDP now, go back) ───
  # search_and_open_pdp lands on PDP, so go back to PLP to capture PLP prices
  - action: tap
    element: product_details_back_button

  - action: waitFor
    element: product_list_filter_button

  - action: captureText
    element: product_list_item_title_0
    variable: plp_title

  - action: captureText
    element: product_list_item_price_0
    variable: plp_selling_price

  - action: captureText
    element: product_list_item_strikethrough_price_0
    variable: plp_mrp_price

  - action: captureText
    element: product_list_item_brand_0
    variable: plp_brand

  - action: logVar
    variable: plp_title
    value: |
      ── PLP prices captured ──
      plp_title          - ${plp_title}
      plp_brand          - ${plp_brand}
      plp_selling_price  - ${plp_selling_price}
      plp_mrp_price      - ${plp_mrp_price}

  # ── Re-enter PDP ───────────────────────────────────────────────────────
  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  # ── PO-11039: Verify core product info elements ─────────────────────────
  - action: verifyElement
    element: product_details_title

  - action: verifyElement
    element: product_details_price

  - action: verifyElement
    element: product_details_strikethrough_price

  # ── Capture PDP prices ─────────────────────────────────────────────────
  - action: captureText
    element: product_details_price
    variable: pdp_selling_price

  - action: captureText
    element: product_details_strikethrough_price
    variable: pdp_mrp_price

  - action: logVar
    variable: pdp_selling_price
    value: |
      ── PDP prices captured ──
      pdp_selling_price  - ${pdp_selling_price}
      pdp_mrp_price      - ${pdp_mrp_price}

  # ── Assert: PLP prices must match PDP prices ───────────────────────────
  - action: assertText
    element: product_details_price
    value: "${plp_selling_price}"

  - action: assertText
    element: product_details_strikethrough_price
    value: "${plp_mrp_price}"
    testCaseId: PO-11039

  # ── Popcoin visibility ─────────────────────────────────────────────────
  - action: ifVarEquals
    variable: api_product_list_item_special_pricing
    value: "true"
    steps:
      - action: verifyElement
        element: product_details_popcoin
        shouldExist: true

  # ── Verify wishlist and share ──────────────────────────────────────────
  - action: verifyElement
    element: product_details_share_button

  - action: tap
    element: product_details_share_button

  - action: pressKey
    value: back

  - action: waitFor
    element: product_details_title

 # - action: tap
  #  element: product_details_title

