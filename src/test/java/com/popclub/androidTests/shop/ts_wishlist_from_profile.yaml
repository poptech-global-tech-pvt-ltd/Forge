testName: Wishlist — Access wishlist from profile
platform: android
noReset: true
loginRequired: true

features:
  - common
  - home
  - shop
  - profile

tags:
  - smoke
  - shop
  - wishlist
  - profile

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # ── Navigate to Profile ──────────────────────────────────────────────────
  - action: tap
    element: home_profile_icon

  - action: waitFor
    element: profile_wishlist_button

  # ── Tap wishlist from profile ────────────────────────────────────────────
  - action: tap
    element: profile_wishlist_button

  - action: waitFor
    element: wishlist_item_card_compose_row

  - action: verifyElement
    element: wishlist_item_0
