testName: Shop E2E — Add to Cart then Remove Item
platform: android
noReset: true
loginRequired: true

# Flow: Search → PDP → Add to Cart → Go to Cart → Find item
#        → Remove item → Verify cart reflects removal

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - cart
  - e2e
retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # ── Navigate to PLP and pick product ──────────────────────────────────────
  - action: call
    flow: plp_search_and_capture
    params:
      search_query:   "the souled store"
      search_pincode: "560102"

  - action: tap
    element: product_list_item_${product_index}

  - action: waitFor
    element: product_details_title

  - action: assertText
    element: product_details_title
    value: "${product_title}"

  # ── Add to Cart ───────────────────────────────────────────────────────────
  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: waitFor
    element: size_selection_item_0

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  - action: waitFor
    element: product_details_go_to_cart_button

  - action: tap
    element: product_details_go_to_cart_button

  # ── Mini-cart bottomsheet: handle address if not set ─────────────────────
  - action: captureText
    element: cart_s2_s_payment_button_button
    variable: cart_bottomsheet_cta

  - action: ifVarEquals
    variable: cart_bottomsheet_cta
    value: "Add address"
    steps:
      - action: tap
        element: cart_s2_s_payment_button_button_2
      - action: call
        flow: add_address
        params:
          addressLine1: "123 MG Road"
          first_name: "Deepa"
          last_name: "Hegde"
          address_mobile_number: "6361463451"

  - action: tap
    element: cart_s2_s_payment_button_button_2

  - action: waitFor
    element: cart_item_row_0

  # ── Find and verify item before removal ──────────────────────────────────
  - action: findCartItemIndex
    value: "${product_title}"
    variable: cart_item_index

  - action: scrollTo
    element: cart_item_row_${cart_item_index}

  - action: captureText
    element: cart_item_title_${cart_item_index}
    variable: cart_item_title_before

  - action: logVar
    variable: cart_item_title_before
    value: |
      ── Before removal ──
      cart_item_index - ${cart_item_index}
      cart_item_title - ${cart_item_title_before}

  - action: assertText
    element: cart_item_title_${cart_item_index}
    value: "${product_title}"

  # ── Remove the item ───────────────────────────────────────────────────────
  - action: cartRemoveItem

  # ── Verify item is gone: either cart is empty or the row no longer exists ─
  - action: logVar
    variable: product_title
    value: "Removed item: ${product_title} — verifying it is no longer in cart"

  - action: verifyElement
    element: cart_item_title_${cart_item_index}
    shouldExist: false
