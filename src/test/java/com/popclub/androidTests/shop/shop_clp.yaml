testName: Shop CLP Verification
platform: android
noReset: true
loginRequired: true

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - clp
  - shop

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    dataRef: test_user_default

  # Capture JWT via API — sets userId in TestContext for personalised CLP API calls
  - action: captureToken
    dataRef: test_user_default

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: waitFor
    element: shop_search_icon

  # Fetch shopmerch-30 API (with real userId + pagination) and assert every section title is rendered
  - action: verifyCLP
    value: SHOP

  # Verify page fully loaded — cross-checks live API sections vs what's on screen
  - action: verifyCLPFullyLoaded
    value: SHOP
