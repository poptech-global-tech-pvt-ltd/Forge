testName: Shop — Cart item price and stepper verify
platform: android
noReset: true
loginRequired: true

testCaseIds:
  - PO-15310

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - cart
  - price
retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    dataRef: test_user_default

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # Navigate to PLP and capture UI + API prices
  - action: call
    flow: plp_search_and_capture
    params:
      search_query:   "the souled store"
      search_pincode: "560102"

  # ── Tap product → PDP → Add to cart ──────────────────────────────────────
  - action: tap
    element: product_list_item_${product_index}

  - action: waitFor
    element: product_details_title

  - action: assertText
    element: product_details_title
    value: "${product_title}"

  - action: verifyElement
    element: product_details_bottom_sticky_bar_button

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: waitFor
    element: size_selection_item_0

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  - action: waitFor
    element: product_details_go_to_cart_button

  - action: tap
    element: product_details_go_to_cart_button

  # ── Mini-cart bottomsheet: handle address if not set ─────────────────────
  - action: captureText
    element: cart_s2_s_payment_button_button
    variable: cart_bottomsheet_cta

  - action: logVar
    variable: cart_bottomsheet_cta
    value: "cart bottomsheet CTA - ${cart_bottomsheet_cta}"

  - action: ifVarEquals
    variable: cart_bottomsheet_cta
    value: "Add address"
    steps:
      - action: tap
        element: cart_s2_s_payment_button_button_2
      - action: call
        flow: add_address
        params:
          addressLine1: "123 MG Road"
          first_name: "Deepa"
          last_name: "Hegde"
          address_mobile_number: "6361463451"

  # ── Proceed to cart screen ────────────────────────────────────────────────
  - action: tap
    element: cart_s2_s_payment_button_button_2

  - action: waitFor
    element: cart_item_row_0

  - action: verifyElement
    element: cart_delivery_address_card

  - action: verifyElement
    element: cart_to_pay_row

  - action: verifyElement
    element: cart_link_and_pay_button

  # ── Find the item we added (may not be at index 0) ────────────────────────
  - action: findCartItemIndex
    value: "${product_title}"
    variable: cart_item_index

  - action: scrollTo
    element: cart_item_row_${cart_item_index}

  # ── Capture cart item details ─────────────────────────────────────────────
  - action: captureText
    element: cart_item_title_${cart_item_index}
    variable: cart_item_title

  - action: captureText
    element: cart_item_price_${cart_item_index}
    variable: cart_item_price

  - action: captureText
    element: cart_item_strikethrough_price_${cart_item_index}
    variable: cart_item_strikethrough_price

  - action: captureText
    element: cart_item_discount_${cart_item_index}
    variable: cart_item_discount

  - action: captureText
    element: cart_item_size_${cart_item_index}
    variable: cart_item_size

  - action: logVar
    variable: cart_item_title
    value: |
      ── Cart item captured ──
      cart_item_index               - ${cart_item_index}
      cart_item_title               - ${cart_item_title}
      cart_item_price               - ${cart_item_price}
      cart_item_strikethrough_price - ${cart_item_strikethrough_price}
      cart_item_discount            - ${cart_item_discount}
      cart_item_size                - ${cart_item_size}
      expected_title                - ${product_title}
      expected_price (PLP UI)       - ${product_list_item_price}
      expected_strikethrough (PLP)  - ${product_list_item_strikethrough_price}
      expected_size (API)           - ${product_size}

  # ── Assert: cart prices match PLP UI prices ───────────────────────────────
  - action: assertText
    element: cart_item_title_${cart_item_index}
    value: "${product_title}"

  - action: assertText
    element: cart_item_price_${cart_item_index}
    value: "${product_list_item_price}"

  - action: assertText
    element: cart_item_strikethrough_price_${cart_item_index}
    value: "${product_list_item_strikethrough_price}"

  - action: assertText
    element: cart_item_size_${cart_item_index}
    value: "${product_size}"

  # ── Quantity stepper ──────────────────────────────────────────────────────
  - action: captureText
    element: cart_item_quantity_${cart_item_index}
    variable: cart_item_quantity_initial

  - action: logVar
    variable: cart_item_quantity_initial
    value: "cart_item_quantity (initial) - ${cart_item_quantity_initial}"

  - action: verifyElement
    element: cart_item_increase_button_${cart_item_index}
    shouldExist: true

  - action: verifyElement
    element: cart_item_decrease_button_${cart_item_index}
    shouldExist: true

  # Increase → expect quantity 2
  - action: tap
    element: cart_item_increase_button_${cart_item_index}

  - action: captureText
    element: cart_item_quantity_${cart_item_index}
    variable: cart_item_quantity_after_increase

  - action: logVar
    variable: cart_item_quantity_after_increase
    value: "cart_item_quantity (after +) - ${cart_item_quantity_after_increase}"

  - action: assertText
    element: cart_item_quantity_${cart_item_index}
    value: "2"

  # Decrease → back to 1
  - action: tap
    element: cart_item_decrease_button_${cart_item_index}

  - action: captureText
    element: cart_item_quantity_${cart_item_index}
    variable: cart_item_quantity_after_decrease

  - action: logVar
    variable: cart_item_quantity_after_decrease
    value: "cart_item_quantity (after -) - ${cart_item_quantity_after_decrease}"

  - action: assertText
    element: cart_item_quantity_${cart_item_index}
    value: "1"
