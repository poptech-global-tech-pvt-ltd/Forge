testName: Shop — Search Yogabar, Verify Price on PDP and Cart
platform: android
noReset: true
loginRequired: true

testCaseIds:
  - PO-SHOP-SEARCH-PRICE-CART

features:
  - common
  - home
  - login
  - shop

tags:
  - smoke
  - shop
  - search
  - pdp
  - cart
  - price

retry: 1

steps:
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  - action: loginIfNeeded
    dataRef: users.test_user_default

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: waitFor
    element: shop_search_button

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: perfume

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  - action: captureText
    element: product_details_title
    value: item0_title

  - action: captureText
    text: "₹"
    value: item0_pdp_price

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tapIfPresent
    element: size_selection_item_0

  - action: tapIfPresent
    element: size_selection_add_to_cart_button

  - action: pressKey
    value: back

  - action: waitFor
    element: product_list_item_1

  - action: tap
    element: product_list_item_1

  - action: waitFor
    element: product_details_title

  - action: captureText
    element: product_details_title
    value: item1_title

  - action: captureText
    text: "₹"
    value: item1_pdp_price

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tapIfPresent
    element: size_selection_item_0

  - action: tapIfPresent
    element: size_selection_add_to_cart_button

  - action: pressKey
    value: back

  - action: tap
    element: cart_icon

  - action: waitFor
    element: cart_item_row_0

  - action: scanTags

  # Capture the total payable shown in cart
  - action: captureText
    element: cart_to_pay_row
    value: cart_total

  - action: verifyElement
    element: cart_item_row_0

  - action: verifyElement
    element: cart_to_pay_row

  - action: verifyElement
    element: cart_s2_s_payment_button_button
