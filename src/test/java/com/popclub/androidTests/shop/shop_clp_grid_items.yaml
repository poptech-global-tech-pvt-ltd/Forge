  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: waitFor
    element: shop_search_icon

  - action: verifyCLP
    value: SHOP

  - action: verifyClpSectionItems
    value: SHOP
