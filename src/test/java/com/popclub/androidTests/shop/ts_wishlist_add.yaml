testName: Wishlist — Add item and verify title matches API
platform: android
noReset: true
loginRequired: true
retry: 1

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - wishlist

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # ── API: fetch first available product ───────────────────────────────────
  - action: call
    flow: search_get_product
    params:
      search_query:   "yogabar"
      search_pincode: "560102"

  # ── UI: search and navigate to PLP ───────────────────────────────────────
  - action: waitFor
    element: shop_search_button

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "yogabar"

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  # ── Open PDP and add to wishlist ─────────────────────────────────────────
  - action: tap
    element: product_list_item_${product_index}

  - action: waitFor
    element: product_details_title

  - action: tap
    element: product_details_wishlist_button

  # ── Go back to PLP and open wishlist from header ─────────────────────────
  - action: pressKey
    value: back

  - action: waitFor
    element: product_list_item_0

  - action: waitFor
    element: wishlist_icon

  - action: tap
    element: wishlist_icon

  - action: waitFor
    element: wishlist_item_card_compose_row

  # ── Verify wishlisted product matches API product_title ──────────────────
  - action: verifyElement
    element: wishlist_item_0

  - action: assertStoredText
    value: product_title
