testName: PDP — Out of Stock CTA
platform: android
noReset: true
loginRequired: true
retry: 1

testCaseIds:
  - PO-11063

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - pdp
  - oos

steps:
  - action: call
    flow: login_and_go_to_shop

  - action: call
    flow: search_get_oos_product

  - action: waitFor
    element: shop_search_button

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "yogabar"

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_filter_button

  - action: tap
    element: product_list_item_${oos_product_index}

  - action: waitFor
    element: product_details_title

  - action: scanTags