testName: Wishlist — Add item and verify title matches
platform: android
noReset: true
loginRequired: true
retry: 1

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - wishlist

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  # ── API: get product data ────────────────────────────────────────────────
  - action: call
    flow: search_get_product
    params:
      search_query:   "yogabar"
      search_pincode: "560102"

  # ── UI: search and navigate to PLP ───────────────────────────────────────
  - action: waitFor
    element: shop_search_button

  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "yogabar"

  - action: pressKey
    value: search
    
  - action: waitFor
    element: product_list_filter_button
    
  - action: tap
    element: product_list_item_0

  # ── Open PDP and add to wishlist ─────────────────────────────────────────

  - action: waitFor
    element: product_details_title

  - action: tap
    element: product_details_wishlist_button

  # ── Go back to PLP and open wishlist from header ─────────────────────────
  - action: pressKey
    value: back

  - action: waitFor
    element: product_list_item_0

  - action: waitFor
    element: toolbar_wishlist_button

  - action: tap
    element: toolbar_wishlist_button

  - action: waitFor
    element: wishlist_item_card_compose_row

  # ── Verify wishlisted product matches API title ──────────────────────────
  - action: verifyElement
    element: wishlist_item_0

  - action: captureText                   
    element: wishlist_item_0                 
    variable: wishlist_ui_title              

  - action: assertStoredText
    variable: wishlist_ui_title             
    value: "${product_title}"                