# PO-11049 — Verify trust badges row shows Secure payments, COD availability, and Return policy
testName: PDP — Trust badges (Secure payments, COD, Return policy)
platform: android
noReset: true
loginRequired: true
retry: 1

testCaseIds:
  - PO-11049

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - pdp
  - trust-badges

steps:
  - action: call
    flow: navigate_to_pdp
    params:
      search_query:   "yogabar"
      search_pincode: "560102"
      login_phone:    "1234561819"
      login_pin:      "560102"

  # ── Scroll down to trust badges area ─────────────────────────────────────
  - action: swipe
    value: up

  - action: swipe
    value: up

  # ── PO-11049: Verify trust badge elements ───────────────────────────────
  - action: tapByText
    value: "Secure payments"
    testCaseId: PO-11049

  - action: waitFor
    element: product_details_title

  - action: tapByText
    value: "COD"
    testCaseId: PO-11049

  - action: tapByText
    value: "Return"
    testCaseId: PO-11049
