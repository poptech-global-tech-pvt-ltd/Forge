testName: Cart — FTUE shows Add address CTA
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11239

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - cart
  - regression

retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: tap
    element: toolbar_cart_button

  - action: waitFor
    element: cart_move_from_cart_button
    timeout: 5000

  # PO-11239: FTUE cart shows 'Add address' instead of 'Pay'
  - action: verifyElement
    element: cart_s2_s_payment_button_button_1
    testCaseId: PO-11239

  - action: verifyElement
    text: "Add address"