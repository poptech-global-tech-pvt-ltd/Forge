testName: Cart — Empty wishlist popup
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11236

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234563737"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: call
    flow: search_product
    params:
      search_query: "souled store"

  # ── Select first product ──
  - action: tap
    element: product_list_item_0

  # ── Add to cart ──
  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  # ── Go to cart ──
  - action: tap
    element: product_details_go_to_cart_button

  # Scroll to Add from wishlist
  - action: scrollUntilVisible
    element: cart_add_from_wishlist_button
    maxScrolls: 4

    # PO-11236: Tap Add from wishlist — empty wishlist popup
  - action: tap
    element: cart_add_from_wishlist_button

  - action: assertText
    element: cart_empty_wishlist_title  # healed locator → cart_wishlist_item_title
    value: "Your wishlist is empty"
    testCaseId: PO-11236

  - action: verifyElement
    element: cart_checkout_pop_shop_button

  - action: tap
    element: skip_tour