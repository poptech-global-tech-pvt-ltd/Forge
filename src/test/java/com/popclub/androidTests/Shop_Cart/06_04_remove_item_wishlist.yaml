testName: Cart — Remove item and move to wishlist
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11215

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: call
    flow: search_product
    params:
      search_query: "souled store"

  # ── Select first product ──
  - action: tap
    element: product_list_item_0

  # ── Add to cart ──
  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  # ── Go to cart ──
  - action: tap
    element: product_details_go_to_cart_button

  # PO-11214: Tap '−' at qty 1 shows 'Move to wishlist?' popup
  - action: tap
    element: cart_iteam_decrease

  - action: verifyElement
    element: cart_remove_product_button
    testCaseId: PO-11214

  - action: verifyElement
    element: cart_add_to_wishlist_button

  # PO-11216: Tap 'Add to wishlist' removes from cart, adds to wishlist
  - action: tap
    element: cart_add_to_wishlist_button
    testCaseId: PO-11216

  # Re-add item to cart for next test (navigate back to shop, add item)
  # PO-11215: Tap 'Remove' removes item
  # (Need fresh cart item — run separately or re-add item)