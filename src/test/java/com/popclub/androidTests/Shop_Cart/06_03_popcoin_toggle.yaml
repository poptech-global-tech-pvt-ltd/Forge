testName: Cart — POPCoins toggle discount
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-11218

features:
  - common
  - login
  - home
  - shop

tags:
  - shop
  - regression

retry: 0

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab

  - action: call
    flow: search_product
    params:
      search_query: "souled store"

  # ── Select first product ──
  - action: tap
    element: product_list_item_0

  # ── Add to cart ──
  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  # ── Go to cart ──
  - action: tap
    element: product_details_go_to_cart_button

  # Scroll to price summary

  - action: scrollUntilVisible
    element: cart_to_pay_row
    maxScrolls: 3

  # Capture total before POPCoins

  - action: captureText
    element: cart_to_pay_row
    variable: total_before

  # PO-11218: POPCoins toggle card shown

  - action: scrollUntilVisible
    element: pop_toggle_row
    maxScrolls: 2


  - action: verifyElement
    element: pop_toggle_row
    testCaseId: PO-11218

  # PO-11219: Enable toggle — discount applied
  # NOTE: Need popcoin toggle element key — if not available, use tapByText

  - action: tap
    element: pop_toggle_row

  - action: scrollUntilVisible
    element: cart_to_pay_row

  - action: captureText
    element: cart_to_pay_row
    variable: cart_to_pay_price_text


  - action: logVar
    variable: total_after_toggle
    value: "Total after POPCoins: ${total_after_toggle}"
    testCaseId: PO-11219

  # PO-11220: Disable toggle — discount removed
  - action: tap
    element: pop_toggle_row

  - action: captureText
    element: cart_to_pay_row
    variable: total_after_disable

  - action: logVar
    variable: total_after_disable
    value: "Total after disable: ${total_after_disable}"
    testCaseId: PO-11220
