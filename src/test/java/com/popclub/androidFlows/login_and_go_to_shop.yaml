# Reusable flow: login and navigate to Shop tab
#
# Inputs:
#   login_phone  — phone number  (optional — default: "1234561122")
#   login_pin    — PIN           (optional — default: "560102")

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561234"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab
