steps:
  - action: callService
    service: search.plp
    params:
      query:   "yogabar"
      pincode: "560102"
    extract:
      oos_product_title: >
        data[0].hits.find {
          it.availability.is_available_to_buy == false
        }.title

      oos_product_index: >
        data[0].hits.findIndexOf {
          it.availability.is_available_to_buy == false
        }
