# RCBP config — SIT environment
#
# Maps to Postman collection variables:
#   {{pop-rcbp-base}}   → rcbp.base.url          (catalogue, recharge, CC all, prepaid initiate)
#   (hardcoded URL)     → rcbp.api.base.url       (https://api.popclub.co.in/rcbp/api — postpaid+prepaid bills/payment)
#   {{phone}}           → rcbp.phone              (customer mobile number)
#   {{user_id}}         → rcbp.user.id            (CC list billers, postpaid billers+inputFields, prepaid initiate)
#   {{userid}}          → rcbp.userid             (legacy — kept for reference)
#   {{X-Userid}}        → rcbp.x.userid           (recharge fetch operators/states)
#   (hardcoded UUID)    → rcbp.operator.userid    (019cfef7-... — postpaid+prepaid bills/payment/confirm)
#   (hardcoded UUID)    → rcbp.cc.input.userid    (019a97c6-... — CC input fields, bills, payment)
#   {{operator_name}}   → rcbp.operator.name      (operator name for prepaid fetch plans)
#
# NOTE: Authorization is DISABLED on every request — no token property is needed.

rcbp.base.url=

# Alternate base for postpaid/prepaid bill fetch, initiate, confirm
# Hardcoded in collection as https://api.popclub.co.in/rcbp/api
rcbp.api.base.url=

rcbp.phone=

# CC list billers / postpaid list billers + input fields / prepaid initiate payment
rcbp.user.id=

# Legacy mobile postpaid — not used in new collections
rcbp.userid=

# Recharge fetch operators/states
rcbp.x.userid=

# Postpaid + prepaid: operator-circle, bill fetch, initiate, confirm
# Hardcoded as 019cfef7-10b7-7cdc-8077-b96cf69e39d6 in collection
rcbp.operator.userid=019cfef7-10b7-7cdc-8077-b96cf69e39d6

# CC: input fields, fetch bills, initiate, confirm
# Hardcoded as 019a97c6-d10a-745c-b303-e39b963e540d in collection
rcbp.cc.input.userid=019a97c6-d10a-745c-b303-e39b963e540d

# Operator name for prepaid fetch plans (?name= query param)
rcbp.operator.name=
