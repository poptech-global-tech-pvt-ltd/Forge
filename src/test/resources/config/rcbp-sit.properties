# RCBP config — SIT environment
#
# Maps to Postman collection variables:
#   {{pop-rcbp-base}}   → rcbp.base.url         (single base URL for ALL requests)
#   {{phone}}           → rcbp.phone             (customer mobile number)
#   {{user_id}}         → rcbp.user.id           (X-Userid on credit card requests)
#   {{userid}}          → rcbp.userid            (X-Userid on mobile postpaid requests)
#   {{X-Userid}}        → rcbp.x.userid          (X-Userid on recharge operators/plans)
#   (hardcoded UUID)    → rcbp.operator.userid   (X-Userid hardcoded in operator-circle request)
#
# NOTE: {{rcbp_token}} is a collection variable but Authorization is DISABLED on
# every request — no token property is needed.

rcbp.base.url=

rcbp.phone=

# Credit card requests
rcbp.user.id=

# Mobile postpaid requests
rcbp.userid=

# Recharge fetch operators/states + fetch plans
rcbp.x.userid=

# Recharge operator-circle — hardcoded as 019cfef7-10b7-7cdc-8077-b96cf69e39d6 in collection
rcbp.operator.userid=019cfef7-10b7-7cdc-8077-b96cf69e39d6
