# Filters-menu-list API — sneakers
testName: Filters-menu-list API — sneakers
platform: android
noReset: true
loginRequired: true

features:
  - common
  - login

tags:
  - api
  - smoke
  - search

retry: 1

steps:

  # ── 1. Login & capture JWT ────────────────────────────────────────────────────
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  # loginIfNeeded auto-captures the JWT into ${auth_token} and userId into ${user_id}

  # ── 2. Filters-menu-list — POST https://sherlock.popclub.co.in/api/v4/filters-menu-list ─
  - action: fetchApi
    url: "https://sherlock.popclub.co.in/api/v4/filters-menu-list"
    method: POST
    body: '{"filters":{},"query":"sneakers"}'
    headers:
      Content-Type: "application/json"
      Authorization: "Token ${auth_token}"
      X-Userid: "${user_id}"
    variable: filters_menu_list_response
    extract:
      is_success:            "is_success"
      menu_item_count:       "data[0].menu_items.length()"
      menu_item_0_id:        "data[0].menu_items[0].id"
      menu_item_0_name:      "data[0].menu_items[0].name"
      menu_item_0_type:      "data[0].menu_items[0].type"
      response_time_ms:      "data[0].response_time_ms"