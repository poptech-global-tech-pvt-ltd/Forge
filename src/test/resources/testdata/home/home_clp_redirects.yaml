testName: Home CLP Redirects All Items
platform: android
noReset: true

testCaseIds:
  - PO-HOME-CLP-REDIRECTS

features:
  - home
  - login

tags:
  - clp
  - home
  - redirects

retry: 0

steps:
  # ── 1. Launch & login ───────────────────────────────────────────────────────
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  - action: enterText
    element: login_input_phone
    value: 1234561122

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    value: 560102

  - action: captureToken
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # ── 2. Fetch Home CLP sections (populates TestContext) ──────────────────────
  - action: verifyCLP
    value: HOME

  # ── 3. Tap every item in every section — verifies all redirects ─────────────
  #       ✅ navigation detected (back button visible after tap)
  #       ⚠️  item not visible on screen (skipped — may be inside carousel)
  #       ❌ fails only if ZERO items navigate successfully across all sections
  # ─────────────────────────────────────────────────────────────────────────────
  - action: verifyCLPRedirects
    value: HOME
    text: "all"
