testName: Home CLP — Grid Section Items Verification
platform: android
noReset: false

testCaseIds:
  - PO-HOME-CLP-GRID

features:
  - home
  - login

tags:
  - smoke
  - clp
  - home
  - grid

retry: 1

steps:
  # ── 1. Launch & login ───────────────────────────────────────────────────────
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  - action: enterText
    element: login_input_phone
    value: 1234561122

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    value: 560102

  - action: captureToken
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # ── 2. Fetch all Home CLP sections & verify section titles on screen ─────────
  #       Stores every section's items in TestContext for the step below.
  # ─────────────────────────────────────────────────────────────────────────────
  - action: verifyCLP
    value: HOME

  # ── 3. Auto-detect every grid section on Home CLP and verify items ───────────
  #       ✅ item tiles visible on screen
  #       ⚠️  items inside horizontal scroll — not a failure
  #       ❌ fails only if a grid section renders ZERO items
  # ─────────────────────────────────────────────────────────────────────────────
  - action: verifyClpSectionItems
    value: HOME
    # element: omitted → automatically checks ALL grid sections on this page
