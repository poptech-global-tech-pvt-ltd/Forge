testName: Shop — Add Item to Wishlist and Verify in Wishlist
platform: android
noReset: true
loginRequired: true

testCaseIds:
  - PO-SHOP-WISHLIST

features:
  - home
  - login
  - shop

tags:
  - smoke
  - shop
  - search
  - wishlist

retry: 1

steps:
  # ── 1. Launch & login ─────────────────────────────────────────────────────────
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  # loginIfNeeded: logs in if login screen is visible, no-op if already logged in
  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # ── 2. Navigate to Shop ───────────────────────────────────────────────────────
  - action: tap
    element: shop_tab

  - action: waitFor
    element: shop_search_icon

  # ── 3. Search for yogabar ─────────────────────────────────────────────────────
  - action: tap
    element: shop_search_icon

  - action: enterText
    element: search_input
    value: yogabar

  - action: pressKey
    value: ENTER

  - action: waitFor
    element: product_list_filter_button

  # ── 4. Open item 0 PDP ───────────────────────────────────────────────────────
  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  # Capture the title so we can verify it appears in the wishlist later
  - action: captureText
    element: product_details_title
    value: wishlisted_title

  # ── 5. Add to wishlist (heart button on PDP) ──────────────────────────────────
  - action: tap
    element: product_details_wishlist_button

  # ── 6. Go back to search results ─────────────────────────────────────────────
  - action: pressKey
    value: BACK

  - action: waitFor
    element: product_list_filter_button

  # ── 7. Navigate to Wishlist ───────────────────────────────────────────────────
  # qaTestTag in popdroid: "wishlsit" (note: typo is intentional — matches app code)
  - action: tap
    element: wishlist_icon

  - action: waitFor
    element: wishlist_item_card_compose_row

  # ── 8. Verify the product is in the wishlist ──────────────────────────────────
  - action: assertStoredText
    value: wishlisted_title
