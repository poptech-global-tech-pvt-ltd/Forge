testName: Shop CLP Full Verification
platform: android
noReset: true

testCaseIds:
  - PO-SHOP-CLP-FULL

features:
  - home
  - login
  - shop

tags:
  - smoke
  - clp
  - shop
  - regression

retry: 1

steps:
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: shop_tab

  - action: waitFor
    element: shop_search_icon

  # ══════════════════════════════════════════════════════════════════
  # STEP 1: Fetch all CLP pages (paginated), verify every section
  #   title + subtitle is rendered. Prints full indexed content tree
  #   including: items[0..N], prices, discounts, POPcoins, filters,
  #   and banner CTAs. Stores everything in TestContext for all steps below.
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLP
    value: SHOP

  # ══════════════════════════════════════════════════════════════════
  # STEP 2: Assert page is fully loaded — no shimmer/spinner remaining,
  #   no section is empty (title visible but zero items below it).
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLPFullyLoaded
    value: SHOP

  # ══════════════════════════════════════════════════════════════════
  # STEP 3: Verify section order on screen matches API order.
  #   Catches merchandising priority issues (wrong section rendered first).
  #   Logs mismatches as warnings — does not hard-fail.
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLPOrder
    value: SHOP

  # ══════════════════════════════════════════════════════════════════
  # STEP 4: Verify prices, discounts and POPcoins for every item
  #   that has price data in the API response.
  #   ✅ ₹selling_price visible  ✅ discount badge  ✅ POPcoins badge
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLPPrices
    value: SHOP

  # ══════════════════════════════════════════════════════════════════
  # STEP 5: Verify hero banners — tap each CTA button ("Explore",
  #   "Shop now") and confirm a destination page opens. Press Back.
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLPBanners
    value: SHOP

  # ══════════════════════════════════════════════════════════════════
  # STEP 6: Verify filter chips in each section.
  #   In-page filters (Men/Women): screen content must change.
  #   Deep-link chips: listing page must open (Sort + Filters bar).
  #   Restores to first filter after each section.
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLPFilters
    value: SHOP

  # ══════════════════════════════════════════════════════════════════
  # STEP 7: Verify horizontal carousel swipe reveals more items.
  #   Swipes left up to 3 times per section, checks new items appear.
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLPCarouselSwipe
    value: SHOP
    text: "3"

  # ══════════════════════════════════════════════════════════════════
  # STEP 8: Verify "See All" / "View All" links open listing pages.
  #   Taps the link, checks Sort+Filters bar or back button, presses Back.
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLPSeeAll
    value: SHOP

  # ══════════════════════════════════════════════════════════════════
  # STEP 9: Tap first item per section → verify detail page opens → Back.
  #   Confirms every carousel/grid item is tappable and redirects.
  # ══════════════════════════════════════════════════════════════════
  - action: verifyCLPRedirects
    value: SHOP
    text: "1"

  # ══════════════════════════════════════════════════════════════════
  # STEP 10: Pull to refresh — verify CLP reloads without crash.
  #   Then re-verify section titles are still present after refresh.
  # ══════════════════════════════════════════════════════════════════
  - action: pullToRefresh

  - action: verifyCLP
    value: SHOP
