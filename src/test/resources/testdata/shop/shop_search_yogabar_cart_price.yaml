testName: Shop — Search Yogabar, Verify Price on PDP and Cart
platform: android
noReset: true
loginRequired: true

testCaseIds:
  - PO-SHOP-SEARCH-PRICE-CART

features:
  - home
  - login
  - shop

tags:
  - smoke
  - shop
  - search
  - pdp
  - cart
  - price

retry: 1

steps:
  # ── 1. Launch & login ─────────────────────────────────────────────────────────
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  # loginIfNeeded: logs in if login screen is visible, no-op if already logged in
  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # ── 2. Navigate to Shop tab ───────────────────────────────────────────────────
  - action: tap
    element: shop_tab

  - action: waitFor
    element: shop_search_icon

  # ── 3. Open search ────────────────────────────────────────────────────────────
  - action: tap
    element: shop_search_icon

  - action: enterText
    element: search_input
    value: yogabar

  - action: pressKey
    value: ENTER

  - action: waitFor
    element: product_list_filter_button

  # ── 4. Item 0 — capture list price, open PDP, verify price, add to cart ───────
  # Capture the first ₹ price visible on the product-list (belongs to item 0)
  - action: captureText
    text: "₹"
    value: item0_list_price

  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  # Capture the product title from PDP
  - action: captureText
    element: product_details_title
    value: item0_title

  # Capture the selling price shown on the PDP
  - action: captureText
    text: "₹"
    value: item0_pdp_price

  # Assert the list price is also visible on the PDP (price should be consistent)
  - action: assertStoredText
    value: item0_list_price

  # Add to cart — tap the sticky bottom bar button
  - action: tap
    element: product_details_bottom_sticky_bar_button

  # If a size picker appeared, select size 0 then confirm
  # (tapIfPresent is a no-op if the element is absent)
  - action: tapIfPresent
    locator: size_selection_item_0

  - action: tapIfPresent
    locator: size_selection_add_to_cart_button

  # Return to search results
  - action: pressKey
    value: BACK

  - action: waitFor
    element: product_list_filter_button

  # ── 5. Item 1 — same flow ─────────────────────────────────────────────────────
  - action: captureText
    text: "₹"
    value: item1_list_price

  - action: tap
    element: product_list_item_1

  - action: waitFor
    element: product_details_title

  - action: captureText
    element: product_details_title
    value: item1_title

  - action: captureText
    text: "₹"
    value: item1_pdp_price

  - action: assertStoredText
    value: item1_list_price

  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: tapIfPresent
    locator: size_selection_item_0

  - action: tapIfPresent
    locator: size_selection_add_to_cart_button

  - action: pressKey
    value: BACK

  # ── 6. Open Cart ──────────────────────────────────────────────────────────────
  - action: tap
    element: cart_icon

  - action: waitFor
    element: cart_item_image

  # ── 7. Verify item 0 title and price are in cart ─────────────────────────────
  - action: assertStoredText
    value: item0_title

  - action: assertStoredText
    value: item0_pdp_price

  # ── 8. Verify item 1 title and price are in cart ─────────────────────────────
  - action: assertStoredText
    value: item1_title

  - action: assertStoredText
    value: item1_pdp_price
