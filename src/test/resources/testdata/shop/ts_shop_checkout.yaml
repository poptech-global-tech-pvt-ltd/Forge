# Generated by recorder-claude-steps.py analysis
# Context: Shop add to cart and checkout
# Generated: 2026-06-02

testName: Shop add to cart and checkout
platform: android
noReset: true

features:
  - common
  - login
  - home
  - shop

tags:
  - smoke
  - shop
retry: 1
steps:
  # Step 1: Launch app and navigate to Shop
  - action: launchApp

  # loginIfNeeded: logs in if login screen is visible, no-op if already logged in
  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: common_shop_tab


  # Step 2: Verify Shop CLP loaded
  - action: waitFor
    element: shop_search_button

  # Step 3: Open search and search for t-shirt
  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: "t-shirt"

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  # Step 4: Select first product from results
 # - action: tap
 #   element: product_list_item_0
    
  - action: tap
    element: product_list_item_1


  - action: waitFor
    element: product_details_title

  - action: verifyElement
    element: product_details_bottom_sticky_bar_button

  # Step 5: On PDP — capture the product name
  - action: captureText
    element: product_details_title
    variable: productName

  # Step 5: Add to cart — select size and confirm
  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: waitFor
    element: size_selection_item_0

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  - action: waitFor
    element: product_details_go_to_cart_button

  # Step 6: Go to cart
  - action: tap
    element: product_details_go_to_cart_button

  # On cart — assert the same name appears on the specific element
 # - action: assertText
 #   element: cart_item_name
  #  value: ${productName}
  

    
  - action: captureText
    element: cart_s2_s_payment_button_button  # healed from: cart_s2_s_payment_button_button_2
    variable: cta_title
    
  - action: logVar
    variable: cta_title
    value: "CTA title is" 
    
  # if it equals a known value — do specific steps
  - action: ifVarEquals
    variable: cta_title
    value: "Add address"
    steps:
      - action: tap
        element: cart_s2_s_payment_button_button_2
      - action: call
        flow: add_address
        params:
          addressLine1: "123 MG Road"
          first_name: "Deepa"
          last_name: "Hegde"
          address_mobile_number: "6361463451"
        
   
    
  - action: tap
    element: cart_s2_s_payment_button_button_2

  # Step 7: Verify address is added if not add the address
  - action: ifNotPresent
    element: saved_address_item
    steps:
      - action: call
        flow: add_address
        params:
          addressLine1: "123 MG Road"
          first_name: "Deepa"
          last_name: "Hegde"
          address_mobile_number: "6361463451"

  # Step 7: Verify cart loaded with added item
  - action: waitFor
    element: cart_item_row_0

  - action: verifyElement
    element: cart_delivery_address_card


  - action: verifyElement
    element: cart_to_pay_row


  # Step 8: Verify Pay CTA is present
  - action: verifyElement
    element: cart_link_and_pay_button
