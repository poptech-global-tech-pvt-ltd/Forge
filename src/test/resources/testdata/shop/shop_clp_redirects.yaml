testName: Shop CLP Redirects All Items
platform: android
noReset: true

testCaseIds:
  - PO-SHOP-CLP-REDIRECTS

features:
  - home
  - login
  - shop

tags:
  - clp
  - shop
  - redirects

retry: 0

steps:
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  - action: enterText
    element: login_input_phone
    value: 1234561122

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    value: 560102

  - action: captureToken
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: shop_tab

  - action: waitFor
    element: shop_search_icon

  # Fetch + verify CLP structure first (populates TestContext)
  - action: verifyCLP
    value: SHOP


  # Tap ALL items in every section — verifies every redirect
  # "all" = tap each item, not just the first one per section
  - action: verifyCLPRedirects
    value: SHOP
    text: "all"
