testName: Shop CLP — Grid Section Items Verification
platform: android
noReset: false

testCaseIds:
  - PO-SHOP-CLP-GRID

features:
  - home
  - login
  - shop

tags:
  - smoke
  - clp
  - shop
  - grid

retry: 1

steps:
  # ── 1. Launch & login ───────────────────────────────────────────────────────
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  - action: enterText
    element: login_input_phone
    value: 1234561122

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    value: 560102

  - action: captureToken
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # ── 2. Navigate to Shop tab ─────────────────────────────────────────────────
  - action: tap
    element: shop_tab

  - action: waitFor
    element: shop_search_icon

  # ── 3. Fetch all Shop CLP sections & verify section titles on screen ────────
  #       Stores every section's items in TestContext for the step below.
  # ────────────────────────────────────────────────────────────────────────────
  - action: verifyCLP
    value: SHOP

  # ── 4. Auto-detect every grid section and verify its items are on screen ────
  #       Finds all sections where cardType is "grid" / "horizontal_list" etc.
  #       ✅ items visible on screen
  #       ⚠️  items inside a horizontal carousel (only partially visible — not a fail)
  #       ❌ fails only if a grid section renders ZERO items at all
  # ────────────────────────────────────────────────────────────────────────────
  - action: verifyClpSectionItems
    value: SHOP
    # element: omitted → automatically checks ALL grid sections on this page
