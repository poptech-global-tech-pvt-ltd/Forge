testName: Shop CLP Verification
platform: android
noReset: false

testCaseIds:
  - PO-SHOP-CLP

features:
  - home
  - shop
  - login

tags:
  - smoke
  - clp
  - shop

retry: 1

steps:
  - action: launchApp

  - action: tapIfPresent
    element: skip_tour

  # Login to get a personalised token
  - action: enterText
    element: login_input_phone
    value: 1234561122

  - action: tap
    element: login_button

  - action: enterText
    element: otp_input
    value: 560102

  # Login via API to get JWT — CI-safe, no logcat needed
  - action: captureToken
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  - action: tap
    element: shop_tab

  - action: waitFor
    element: shop_search_icon

  # Fetch shopmerch-30 API response (with user token) and assert every section title is rendered
  - action: verifyCLP
    value: SHOP
