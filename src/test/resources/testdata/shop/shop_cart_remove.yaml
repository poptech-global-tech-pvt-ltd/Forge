testName: Shop — Add to Cart and Remove Item from Cart
platform: android
noReset: true
loginRequired: false

testCaseIds:
  - PO-SHOP-CART-REMOVE

features:
  - common
  - home
  - login
  - shop

tags:
  - smoke
  - shop
  - search
  - cart
  - remove

retry: 1

steps:
  # ── 1. Launch & login ─────────────────────────────────────────────────────────
  - action: launchApp

  - action: loginIfNeeded
    value: "1234561122"
    text: "560102"

  - action: waitFor
    element: home_tab

  # ── 2. Navigate to Shop ───────────────────────────────────────────────────────
  - action: tap
    element: common_shop_tab

  - action: waitFor
    element: shop_search_button

  - action: scanTags

  # ── 3. Search for product ─────────────────────────────────────────────────────
  - action: tap
    element: shop_search_button

  - action: waitFor
    element: search_products_search_input

  - action: enterText
    element: search_products_search_input
    value: t-shirt

  - action: pressKey
    value: search

  - action: waitFor
    element: product_list_item_0

  # ── 4. Open PDP ───────────────────────────────────────────────────────────────
  - action: tap
    element: product_list_item_0

  - action: waitFor
    element: product_details_title

  # ── 5. Add to cart — select size and confirm ──────────────────────────────────
  - action: tap
    element: product_details_bottom_sticky_bar_button

  - action: waitFor
    element: size_selection_item_0

  - action: tap
    element: size_selection_item_0

  - action: tap
    element: size_selection_add_to_cart_button

  - action: waitFor
    element: product_details_go_to_cart_button

  # ── 6. Go to cart ─────────────────────────────────────────────────────────────
  - action: tap
    element: product_details_go_to_cart_button

  - action: waitFor
    element: cart_item_row_0

  - action: scanTags

  - action: verifyElement
    element: cart_delivery_address_card

  - action: verifyElement
    element: cart_to_pay_row

  - action: verifyElement
    element: cart_link_and_pay_button

  # ── 7. Remove item ────────────────────────────────────────────────────────────
  # cartRemoveItem handles:
  #   a) Reads current quantity
  #   b) Decreases quantity to 1 (taps – button once per extra unit)
  #   c) Taps cart_remove_product_button to remove
  #   d) Confirms any removal dialog/bottom-sheet
  #   e) Asserts product title is no longer visible in cart
  - action: cartRemoveItem
