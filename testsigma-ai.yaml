testName: Successful OTP verification with valid OTP - Standard Flow
platform: android

tags:
  - security
  - success-case

steps:

  - action: launchApp

  - action: enterText
    element: login_input_phone
    value: 9876543210

  - action: tap
    element: get_otp_button

  - action: enterText
    element: otp_input
    value: 123456

  - action: tap
    element: verify_otp_button

